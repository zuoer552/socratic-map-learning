      function createTransition(frame, nextFrame) {
        const { transition, metrics } = frame;
        const railX = 124;
        const path = svgElement("path", {
          class: "transition-path",
          d:
            `M${railX},${frame.y - 18} ` +
            `V${nextFrame.markerY - 27}`
        });
        elements.systemFlowLayer.appendChild(path);

        const group = svgElement("g", {
          class: "transition-group",
          transform: `translate(${frame.x},${frame.y})`,
          "data-transition-id": transition.id,
          "data-interactive": "true",
          tabindex: "0",
          role: "button",
          "aria-label": `${transition.label}：${transition.bridge}`
        });
        const rect = svgElement("rect", {
          class: "transition-surface",
          width: metrics.width,
          height: metrics.height,
          rx: 12
        });
        const label = svgElement("text", {
          class: "transition-label",
          x: 20,
          y: 25
        });
        label.textContent = transition.label;
        const text = svgElement("text", {
          class: "transition-text"
        });
        appendWrappedText(
          text,
          metrics.lines,
          20,
          metrics.titleY,
          metrics.lineHeight
        );
        const activate = (event) => {
          event.stopPropagation();
          selectTransition(transition.id);
        };
        group.addEventListener("click", activate);
        group.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            activate(event);
          }
        });
        group.append(rect, label, text);
        elements.systemFlowLayer.appendChild(group);
      }

      function clearGraph() {
        elements.arcLayer.replaceChildren();
        elements.systemFlowLayer.replaceChildren();
        elements.flowLayer.replaceChildren();
        elements.inferenceLayer.replaceChildren();
        elements.nodeLayer.replaceChildren();
        elements.stageLayer.replaceChildren();
      }

      function captureNodeAnchor(nodeId) {
        const position = currentLayout?.positions.get(nodeId);
        if (!position) return null;
        const rect = elements.graphViewport.getBoundingClientRect();
        return {
          nodeId,
          x:
            rect.left +
            view.x +
            (position.x + position.width / 2) * view.scale,
          y:
            rect.top +
            view.y +
            (position.y + position.height / 2) * view.scale
        };
      }

      function restoreAnchor(anchor) {
        if (!anchor) return false;
        const position = currentLayout.positions.get(anchor.nodeId);
        if (!position) return false;
        const rect = elements.graphViewport.getBoundingClientRect();
        view = {
          ...view,
          x:
            anchor.x -
            rect.left -
            (position.x + position.width / 2) * view.scale,
          y:
            anchor.y -
            rect.top -
            (position.y + position.height / 2) * view.scale
        };
        applyView();
        return true;
      }

      function renderSystem({ anchor = null, preserveView = false } = {}) {
        clearGraph();
        currentLayout = systemLayout();
        currentLayout.arcFrames.forEach(createArc);
        currentLayout.stageFrames.forEach(createStage);
        transitions.forEach((transition, index) => {
          const frame = currentLayout.transitionFrames.get(transition.id);
          const nextStage = stages[index + 1];
          const nextFrame = currentLayout.stageFrames.get(nextStage?.id);
          if (frame && nextFrame) createTransition(frame, nextFrame);
        });
        currentLayout.flows.forEach(createFlow);
        if (currentGraph) {
          currentGraph.inferences.forEach(createInference);
        }
        const renderedNodeIds = new Set();
        currentLayout.positions.forEach((_, nodeId) => {
          const node = nodeById.get(nodeId);
          if (!node || renderedNodeIds.has(nodeId)) return;
          renderedNodeIds.add(nodeId);
          createNode(
            node,
            currentLayout.roles.get(nodeId) || "premise"
          );
        });
        applyHighlights();
        if (!restoreAnchor(anchor) && !preserveView) {
          requestAnimationFrame(fitWholeSystem);
        } else {
          applyView();
        }
      }

      function toggleStageProof(stageId) {
        const stage = stageById.get(stageId);
        if (!stage?.answer_id) {
          selectStage(stageId);
          return;
        }
        const anchor = captureNodeAnchor(stage.answer_id);
        if (expandedStageId === stageId) {
          expandedStageId = "";
          expandedMapIds.clear();
        } else {
          expandedStageId = stageId;
          expandedMapIds.clear();
        }
        renderSystem({ anchor, preserveView: true });
      }

      function toggleSubargument(childMap, nodeId) {
        const anchor = captureNodeAnchor(nodeId);
        if (expandedMapIds.has(childMap.id)) {
          removeExpandedBranch(childMap.id);
        } else {
          (childrenByParent.get(childMap.parent_id) || [])
            .filter((sibling) => sibling.id !== childMap.id)
            .forEach((sibling) => removeExpandedBranch(sibling.id));
          expandedMapIds.add(childMap.id);
        }
        renderSystem({ anchor, preserveView: true });
      }

      function clearSelection() {
        selectedNodeId = "";
        selectedInferenceId = "";
        selectedStageId = "";
        selectedTransitionId = "";
      }

      function openInspector() {
        elements.inspector.classList.add("open");
      }

      function closeInspector() {
        elements.inspector.classList.remove("open");
      }

      function setInspector({
        label,
        title,
        lead,
        tags,
        detailHeading = "为什么在这里",
        detail,
        source,
        mastery,
        actions = []
      }) {
        elements.inspectorLabel.textContent = label;
        elements.inspectorTitle.textContent = title;
        elements.inspectorLead.textContent = lead || "";
        elements.inspectorTags.replaceChildren();
        tags.forEach((value) => {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = value;
          elements.inspectorTags.appendChild(tag);
        });
        elements.inspectorDetailHeading.textContent = detailHeading;
        elements.inspectorDetail.textContent = detail || "暂无补充说明。";
        elements.inspectorSource.textContent =
          source || "来源锚点将在审校后补充。";
        elements.inspectorMastery.textContent =
          mastery || "尚未记录掌握证据。";
        elements.inspectorActions.replaceChildren();
        actions.forEach(({ label: actionLabel, run }) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = actionLabel;
          button.addEventListener("click", run);
          elements.inspectorActions.appendChild(button);
        });
        openInspector();
      }

      function evidenceText(node) {
        if (!node.evidence) {
          return `${statusLabels[node.status] || "尚未评估"}。` +
            `掌握标准：${node.mastery_criterion || "能够用自己的话复原理由与后果。"}`;
        }
        const answer =
          node.evidence.answer ||
          node.evidence.text ||
          node.evidence.response ||
          "";
        return (
          `${statusLabels[node.status] || "已记录"}。` +
          `${answer ? `你的证据：“${answer}”` : "已有回答证据。"} ` +
          `掌握标准：${node.mastery_criterion || "能够复原完整连接。"}`
        );
      }

      function selectNode(nodeId) {
        const node = nodeById.get(nodeId);
        if (!node) return;
        clearSelection();
        selectedNodeId = nodeId;
        const stage = stageByAnswer.get(nodeId);
        setInspector({
          label: roleLabels[currentLayout.roles.get(nodeId)] || "命题",
          title: node.title,
          lead: node.summary,
          tags: [
            "命题复述 · 非原文引语",
            statusLabels[node.status] || "尚未评估",
            stage ? `系统主链第 ${stage.position} 问` : "局部证明"
          ],
          detail: `${node.detail || ""}${node.bridge ? ` ${node.bridge}` : ""}`,
          source: node.source,
          mastery: evidenceText(node),
          actions: stage
            ? [{
                label: expandedStageId === stage.id
                  ? "收起本题证明"
                  : "展开本题证明",
                run: () => toggleStageProof(stage.id)
              }]
            : []
        });
        applyHighlights();
      }

      function selectInference(inferenceId) {
        const inference = inferenceById.get(inferenceId);
        if (!inference) return;
        clearSelection();
        selectedInferenceId = inferenceId;
        const premiseTitles = inference.premise_ids
          .map((id) => nodeById.get(id)?.title)
          .filter(Boolean);
        const conclusion = nodeById.get(inference.conclusion_id);
        const sentence =
          `因为${premiseTitles.join("；并且")}，` +
          `所以${conclusion?.title || "得到这个结论"}。`;
        setInspector({
          label: inferenceKindLabels[inference.kind] || "推理关节",
          title: inference.bridge,
          lead: sentence,
          tags: [
            "论证复原 · 非原文箭头",
            `${inference.premise_ids.length} 个必要理由`,
            masteryLabels[inference.mastery_level] || "关系尚未检验"
          ],
          detailHeading: "这一步怎样成立",
          detail:
            `前提：${premiseTitles.join("；")}。` +
            `结论：${conclusion?.title || ""}。`,
          source: inference.source,
          mastery:
            masteryLabels[inference.mastery_level] ||
            "尚未检验你能否独立复原这一步。"
        });
        applyHighlights();
      }

      function selectStage(stageId) {
        const stage = stageById.get(stageId);
        if (!stage) return;
        clearSelection();
        selectedStageId = stageId;
        const answer = nodeById.get(stage.answer_id);
        const proofMap = mapById.get(stage.map_id);
        setInspector({
          label: `系统主链 · 第 ${stage.position} 问`,
          title: stage.question,
          lead: answer
            ? `目前建立的回答：${answer.title}`
            : "这个问题尚未进入来源审校和正式教学。",
          tags: [
            statusLabels[stage.status] || "尚未学习",
            "问题标题 · 不是命题节点",
            stage.origin === "reviewed" ? "结构已审校" : "迁移结构"
          ],
          detailHeading: "它在全书中承担什么任务",
          detail: proofMap?.summary || "等待学习到这里后再展开答案。",
          source: stage.source,
          mastery: answer
            ? evidenceText(answer)
            : "未来问题不提前暴露答案，也不伪造掌握状态。",
          actions: answer
            ? [{
                label: expandedStageId === stage.id
                  ? "收起本题证明"
                  : "展开本题证明",
                run: () => toggleStageProof(stage.id)
              }]
            : []
        });
        applyHighlights();
      }

      function selectTransition(transitionId) {
        const transition = transitionById.get(transitionId);
        if (!transition) return;
        clearSelection();
        selectedTransitionId = transitionId;
        const from = stageById.get(transition.from_stage_id);
        const to = stageById.get(transition.to_stage_id);
        setInspector({
          label: transition.label,
          title: transition.bridge,
          lead:
            `第 ${from.position} 问的结果改变了问题条件，` +
            `因此进入第 ${to.position} 问。`,
          tags: [
            "系统推进关系",
            "结构复原 · 非原文箭头",
            transition.origin === "reviewed" ? "已审校" : "迁移结构"
          ],
          detailHeading: "为什么不能停在上一问",
          detail:
            `上一问：${from.question} 下一问：${to.question}`,
          source: transition.source,
          mastery:
            "当你能不看图说出“上一结论为什么迫使我们继续追问”，" +
            "这条系统连接才算真正掌握。"
        });
        applyHighlights();
      }

      function applyHighlights() {
        const selectedIds = new Set();
        let selectedInference = null;
        if (selectedNodeId) selectedIds.add(selectedNodeId);
        if (selectedInferenceId) {
          selectedInference = inferenceById.get(selectedInferenceId);
          selectedInference?.premise_ids.forEach((id) =>
            selectedIds.add(id)
          );
          if (selectedInference?.conclusion_id) {
            selectedIds.add(selectedInference.conclusion_id);
          }
        }
        const selectedTransition = transitionById.get(selectedTransitionId);
        const hasSelection = Boolean(
          selectedNodeId ||
          selectedInferenceId ||
          selectedStageId ||
          selectedTransitionId
        );

        document.querySelectorAll(".argument-node").forEach((group) => {
          const id = group.dataset.nodeId;
          group.classList.toggle("selected", id === selectedNodeId);
          group.classList.toggle(
            "highlighted",
            selectedInferenceId && selectedIds.has(id)
          );
          group.classList.toggle(
            "dimmed",
            Boolean(selectedInferenceId) && !selectedIds.has(id)
          );
        });
        document.querySelectorAll(".inference-junction").forEach((group) => {
          const id = group.dataset.inferenceId;
          group.classList.toggle("selected", id === selectedInferenceId);
          group.classList.toggle(
            "dimmed",
            Boolean(selectedInferenceId) && id !== selectedInferenceId
          );
        });
        document.querySelectorAll(".flow-group").forEach((group) => {
          const match =
            group.dataset.inferenceId === selectedInferenceId;
          group.classList.toggle("highlighted", match);
          group.classList.toggle(
            "dimmed",
            Boolean(selectedInferenceId) && !match
          );
        });
        document.querySelectorAll(".stage-question").forEach((group) => {
          const id = group.dataset.stageId;
          const transitionMatch = selectedTransition && (
            id === selectedTransition.from_stage_id ||
            id === selectedTransition.to_stage_id
          );
          group.classList.toggle("selected", id === selectedStageId);
          group.classList.toggle("highlighted", Boolean(transitionMatch));
          group.classList.toggle(
            "dimmed",
            hasSelection &&
            Boolean(selectedTransitionId) &&
            !transitionMatch
          );
        });
        document.querySelectorAll(".transition-group").forEach((group) => {
          group.classList.toggle(
            "selected",
            group.dataset.transitionId === selectedTransitionId
          );
        });
      }

      function applyView() {
        elements.graphCamera.setAttribute(
          "transform",
          `translate(${view.x},${view.y}) scale(${view.scale})`
        );
      }

      function setZoomAt(nextScale, clientX, clientY) {
        const bounded = Math.min(2.2, Math.max(0.16, nextScale));
        const rect = elements.graphViewport.getBoundingClientRect();
        const pointerX = clientX - rect.left;
        const pointerY = clientY - rect.top;
        const worldX = (pointerX - view.x) / view.scale;
        const worldY = (pointerY - view.y) / view.scale;
        view = {
          scale: bounded,
          x: pointerX - worldX * bounded,
          y: pointerY - worldY * bounded
        };
        applyView();
      }

      function zoomFromCenter(factor) {
        const rect = elements.graphViewport.getBoundingClientRect();
        setZoomAt(
          view.scale * factor,
          rect.left + rect.width / 2,
          rect.top + rect.height / 2
        );
      }

      function fitWholeSystem() {
        if (!currentLayout) return;
        const rect = elements.graphViewport.getBoundingClientRect();
        const padding = 72;
        const scale = Math.min(
          1,
          (rect.width - padding * 2) / currentLayout.width,
          (rect.height - padding * 2) / currentLayout.height
        );
        view = {
          scale: Math.max(0.16, scale),
          x: (rect.width - currentLayout.width * scale) / 2,
          y: (rect.height - currentLayout.height * scale) / 2
        };
        applyView();
      }

      function jumpToStage(stageId, { focusNode = false } = {}) {
        const frame = currentLayout?.stageFrames.get(stageId);
        if (!frame) return;
        const rect = elements.graphViewport.getBoundingClientRect();
        const isCompact = rect.width < 600;
        const targetScale = isCompact
          ? 0.68
          : Math.min(1.05, Math.max(0.72, view.scale));
        const targetX = frame.x + 260;
        const targetY = frame.y + Math.min(260, frame.bottom - frame.y) / 2;
        view = {
          scale: targetScale,
          x: isCompact
            ? 16 - frame.x * targetScale
            : rect.width * 0.38 - targetX * targetScale,
          y: rect.height * 0.3 - targetY * targetScale
        };
        applyView();
        if (focusNode && frame.answerId) {
          document
            .querySelector(`[data-node-id="${frame.answerId}"]`)
            ?.focus();
        }
      }

      function locateCurrentLearning() {
        let stage = stageByMap.get(data.current.map_id);
        if (!stage) {
          stage = stages.find((item) => {
            const argumentMap = mapById.get(item.map_id);
            return argumentMap?.node_ids.includes(data.current.node_id);
          });
        }
        if (!stage) {
          stage = stages.find((item) => item.status === "current");
        }
        if (!stage) return;
        expandedStageId = stage.answer_id ? stage.id : "";
        expandedMapIds.clear();
        renderSystem({ preserveView: true });
        requestAnimationFrame(() => {
          jumpToStage(stage.id);
          if (currentLayout.positions.has(data.current.node_id)) {
            selectNode(data.current.node_id);
          } else {
            selectStage(stage.id);
          }
        });
      }

      function renderOutline() {
        elements.outlineTitle.textContent = spine.title;
        elements.outlineList.replaceChildren();
        arcs.forEach((arc) => {
          const heading = document.createElement("div");
          heading.className = "outline-arc";
          heading.textContent = arc.title;
          elements.outlineList.appendChild(heading);
          arc.stage_ids.forEach((stageId) => {
            const stage = stageById.get(stageId);
            const button = document.createElement("button");
            button.type = "button";
            button.className = "outline-stage";
            button.innerHTML =
              `<span class="index">${stage.position}</span>` +
              `<span class="label"></span>` +
              `<span class="state"></span>`;
            button.querySelector(".label").textContent = stage.question;
            button.querySelector(".state").textContent =
              statusLabels[stage.status] || "";
            button.addEventListener("click", () => {
              elements.outlinePanel.hidden = true;
              elements.outlineToggle.setAttribute("aria-expanded", "false");
              jumpToStage(stage.id);
              selectStage(stage.id);
            });
            elements.outlineList.appendChild(button);
          });
        });
      }

      function renderAccessibleOutline() {
        const heading = document.createElement("h2");
        heading.textContent = spine.title;
        const goal = document.createElement("p");
        goal.textContent = `最终掌握标准：${spine.terminal_mastery}`;
        const list = document.createElement("ol");
        stages.forEach((stage, index) => {
          const item = document.createElement("li");
          const answer = nodeById.get(stage.answer_id);
          item.textContent =
            `${stage.question} ` +
            `${answer ? `回答：${answer.title}` : "答案尚未展开。"} ` +
            `${transitions[index] ? `${transitions[index].label}：${transitions[index].bridge}` : ""}`;
          list.appendChild(item);
        });
        elements.accessibleOutline.replaceChildren(heading, goal, list);
      }

      function renderProgress() {
        const counts = data.progress.nodes;
        const total = counts.mastered + counts.current + counts.future;
        const ratio = total ? (counts.mastered / total) * 100 : 0;
        elements.progressFill.style.setProperty(
          "--progress",
          `${ratio.toFixed(1)}%`
        );
        elements.progressText.textContent =
          `${counts.mastered} / ${total} 个命题已掌握`;
      }

      function toggleOutline(open) {
        const next =
          typeof open === "boolean"
            ? open
            : elements.outlinePanel.hidden;
        elements.outlinePanel.hidden = !next;
        elements.outlineToggle.setAttribute(
          "aria-expanded",
          String(next)
        );
        if (next) {
          closeInspector();
          elements.outlineClose.focus();
        }
      }

      function setTheme(mode) {
        if (mode === "system") {
          delete document.documentElement.dataset.theme;
        } else {
          document.documentElement.dataset.theme = mode;
        }
        elements.themeToggle.dataset.mode = mode;
        const label = {
          system: "主题：跟随系统",
          light: "主题：浅色",
          dark: "主题：深色"
        }[mode];
        elements.themeToggle.setAttribute("aria-label", label);
        elements.themeToggle.title = label;
      }

      function cycleTheme() {
        const current = elements.themeToggle.dataset.mode || "system";
        const next = current === "system"
          ? "light"
          : current === "light"
            ? "dark"
            : "system";
        setTheme(next);
      }

      elements.graphViewport.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        if (event.target.closest?.("[data-interactive='true']")) return;
        pan = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          viewX: view.x,
          viewY: view.y,
          dragging: false
        };
      });

      elements.graphViewport.addEventListener("pointermove", (event) => {
        if (!pan || pan.pointerId !== event.pointerId) return;
        const dx = event.clientX - pan.startX;
        const dy = event.clientY - pan.startY;
        if (!pan.dragging && Math.hypot(dx, dy) >= 6) {
          pan.dragging = true;
          elements.graphViewport.setPointerCapture(event.pointerId);
          elements.graphViewport.classList.add("dragging");
        }
        if (!pan.dragging) return;
        view.x = pan.viewX + dx;
        view.y = pan.viewY + dy;
        applyView();
      });

      function finishPan(event) {
        if (!pan || pan.pointerId !== event.pointerId) return;
        if (
          pan.dragging &&
          elements.graphViewport.hasPointerCapture(event.pointerId)
        ) {
          elements.graphViewport.releasePointerCapture(event.pointerId);
        }
        if (pan.dragging) suppressNextClick = true;
        elements.graphViewport.classList.remove("dragging");
        pan = null;
      }

      elements.graphViewport.addEventListener("pointerup", finishPan);
      elements.graphViewport.addEventListener("pointercancel", finishPan);
      elements.graphViewport.addEventListener(
        "wheel",
        (event) => {
          event.preventDefault();
          const factor = Math.exp(-event.deltaY * 0.0014);
          setZoomAt(
            view.scale * factor,
            event.clientX,
            event.clientY
          );
        },
        { passive: false }
      );

      elements.graphViewport.addEventListener("click", (event) => {
        if (suppressNextClick) {
          suppressNextClick = false;
          return;
        }
        if (event.target.closest?.("[data-interactive='true']")) return;
        clearSelection();
        closeInspector();
        applyHighlights();
      });

      elements.graphViewport.addEventListener("keydown", (event) => {
        const move = 44;
        if (event.key === "ArrowLeft") view.x += move;
        else if (event.key === "ArrowRight") view.x -= move;
        else if (event.key === "ArrowUp") view.y += move;
        else if (event.key === "ArrowDown") view.y -= move;
        else if (event.key === "+" || event.key === "=") {
          zoomFromCenter(1.16);
          event.preventDefault();
          return;
        } else if (event.key === "-") {
          zoomFromCenter(1 / 1.16);
          event.preventDefault();
          return;
        } else if (event.key === "0") {
          fitWholeSystem();
          event.preventDefault();
          return;
        } else if (event.key === "Escape") {
          closeInspector();
          toggleOutline(false);
          return;
        } else {
          return;
        }
        event.preventDefault();
        applyView();
      });

      elements.outlineToggle.addEventListener("click", () =>
        toggleOutline()
      );
      elements.outlineClose.addEventListener("click", () =>
        toggleOutline(false)
      );
      elements.locateCurrent.addEventListener(
        "click",
        locateCurrentLearning
      );
      elements.themeToggle.addEventListener("click", cycleTheme);
      elements.zoomOut.addEventListener("click", () =>
        zoomFromCenter(1 / 1.16)
      );
      elements.zoomIn.addEventListener("click", () =>
        zoomFromCenter(1.16)
      );
      elements.fitSystem.addEventListener("click", fitWholeSystem);
      elements.collapseProof.addEventListener("click", () => {
        const anchorStage = stageById.get(expandedStageId);
        const anchor = anchorStage?.answer_id
          ? captureNodeAnchor(anchorStage.answer_id)
          : null;
        expandedStageId = "";
        expandedMapIds.clear();
        renderSystem({ anchor, preserveView: true });
      });
      elements.inspectorClose.addEventListener("click", closeInspector);
      window.addEventListener("resize", () => {
        if (!currentLayout) return;
        applyView();
      });

      setTheme("system");
      renderOutline();
      renderAccessibleOutline();
      renderProgress();
      renderSystem({ preserveView: true });
      requestAnimationFrame(() => jumpToStage(stages[0].id));
    })();
  </script>
</body>
</html>
