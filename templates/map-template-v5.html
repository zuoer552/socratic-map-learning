<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{PAGE_TITLE}}</title>
  <style>
    :root {
      --page: #f2f0ea;
      --surface: #fbfaf6;
      --surface-strong: #ffffff;
      --surface-soft: #ece9e1;
      --ink: #18212f;
      --ink-soft: #526071;
      --line: #d6d3ca;
      --line-strong: #8d98a6;
      --blue: #315a9f;
      --blue-soft: #e8eef8;
      --blue-deep: #163b67;
      --amber: #a96616;
      --amber-soft: #fff1d5;
      --red: #a8403a;
      --red-soft: #f9e8e5;
      --green: #2f6d55;
      --green-soft: #e4f1ea;
      --focus: #245eea;
      --default-bg: #ffffff;
      --default-fg: #18212f;
      --default-muted: #526071;
      --default-border: #808a98;
      --conclusion-bg: #163b67;
      --conclusion-fg: #ffffff;
      --conclusion-muted: #d8e7f7;
      --conclusion-border: #163b67;
      --objection-bg: #f9e8e5;
      --objection-fg: #4b1512;
      --objection-muted: #732a25;
      --objection-border: #a8403a;
      --boundary-bg: #fff1d5;
      --boundary-fg: #4a2c08;
      --boundary-muted: #714410;
      --boundary-border: #a96616;
      --junction-bg: #e8eef8;
      --junction-fg: #18212f;
      --junction-muted: #315a9f;
      --junction-border: #315a9f;
      --junction-objection-bg: #f9e8e5;
      --junction-objection-fg: #4b1512;
      --junction-objection-muted: #732a25;
      --junction-objection-border: #a8403a;
      --junction-boundary-bg: #fff1d5;
      --junction-boundary-fg: #4a2c08;
      --junction-boundary-muted: #714410;
      --junction-boundary-border: #a96616;
      --shadow: 0 12px 32px rgba(31, 42, 55, 0.10);
      --radius: 14px;
      --motion: 180ms ease;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11161d;
        --surface: #181f28;
        --surface-strong: #202936;
        --surface-soft: #252e39;
        --ink: #f1f4f8;
        --ink-soft: #b2bdca;
        --line: #344151;
        --line-strong: #7d8b9b;
        --blue: #87aef0;
        --blue-soft: #253750;
        --blue-deep: #b9d2ff;
        --amber: #e8b36c;
        --amber-soft: #46351f;
        --red: #ee9d96;
        --red-soft: #4a2928;
        --green: #83c8aa;
        --green-soft: #263c34;
        --focus: #8bb2ff;
        --default-bg: #202936;
        --default-fg: #f1f4f8;
        --default-muted: #b2bdca;
        --default-border: #7d8b9b;
        --conclusion-bg: #173b64;
        --conclusion-fg: #ffffff;
        --conclusion-muted: #c7dcf3;
        --conclusion-border: #87aef0;
        --objection-bg: #4a2928;
        --objection-fg: #fff3f2;
        --objection-muted: #f2bab5;
        --objection-border: #ee9d96;
        --boundary-bg: #46351f;
        --boundary-fg: #fff5dd;
        --boundary-muted: #f2cf91;
        --boundary-border: #e8b36c;
        --junction-bg: #253750;
        --junction-fg: #f1f4f8;
        --junction-muted: #b9d2ff;
        --junction-border: #87aef0;
        --junction-objection-bg: #4a2928;
        --junction-objection-fg: #fff3f2;
        --junction-objection-muted: #f2bab5;
        --junction-objection-border: #ee9d96;
        --junction-boundary-bg: #46351f;
        --junction-boundary-fg: #fff5dd;
        --junction-boundary-muted: #f2cf91;
        --junction-boundary-border: #e8b36c;
        --shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: var(--page);
      color: var(--ink);
      font-family:
        Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }

    button,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    select:focus-visible,
    [tabindex="0"]:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 72%, transparent);
      outline-offset: 3px;
    }

    .skip-link {
      position: fixed;
      z-index: 1000;
      top: 8px;
      left: 8px;
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--surface-strong);
      color: var(--ink);
      transform: translateY(-160%);
      transition: transform var(--motion);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .app {
      display: grid;
      grid-template-columns: 262px minmax(0, 1fr) 326px;
      grid-template-rows: auto minmax(0, 1fr);
      height: 100dvh;
      min-height: 0;
    }

    .topbar {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 262px minmax(0, 1fr) 326px;
      min-height: 72px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      backdrop-filter: blur(14px);
    }

    .brand,
    .reading-rule,
    .progress {
      display: flex;
      align-items: center;
      min-width: 0;
      padding: 14px 18px;
    }

    .brand {
      gap: 11px;
      border-right: 1px solid var(--line);
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 11px;
      background: var(--blue-deep);
      color: var(--surface-strong);
      font-family: ui-serif, "Songti SC", serif;
      font-size: 18px;
      font-weight: 800;
    }

    .brand-copy {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 2px;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .brand h1 {
      overflow: hidden;
      margin: 0;
      font-family: ui-serif, "Songti SC", "STSong", serif;
      font-size: 17px;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .reading-rule {
      justify-content: center;
    }

    .rule-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border: 1px solid color-mix(in srgb, var(--blue) 30%, var(--line));
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue-deep);
      font-size: 13px;
      font-weight: 750;
      white-space: nowrap;
    }

    .rule-arrow {
      font-size: 18px;
      line-height: 1;
    }

    .progress {
      justify-content: space-between;
      gap: 16px;
      border-left: 1px solid var(--line);
    }

    .progress-number {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }

    .progress-copy {
      color: var(--ink-soft);
      font-size: 12px;
    }

    .navigator {
      min-height: 0;
      overflow: auto;
      padding: 18px 14px 28px;
      border-right: 1px solid var(--line);
      background: var(--surface);
      scrollbar-gutter: stable;
    }

    .nav-heading {
      margin: 0 8px 10px;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav-help {
      margin: 0 8px 16px;
      color: var(--ink-soft);
      font-size: 12px;
    }

    .map-list {
      display: grid;
      gap: 4px;
    }

    .map-button {
      display: grid;
      grid-template-columns: 8px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      width: 100%;
      min-height: 48px;
      padding: 10px 10px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition:
        background var(--motion),
        border-color var(--motion);
    }

    .map-button:hover {
      background: var(--surface-soft);
    }

    .map-button.active {
      border-color: color-mix(in srgb, var(--blue) 36%, var(--line));
      background: var(--blue-soft);
    }

    .map-button[disabled] {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .map-button.child {
      padding-left: 24px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      margin-top: 7px;
      border-radius: 999px;
      background: var(--line-strong);
    }

    .map-button.mastered .status-dot {
      background: var(--green);
    }

    .map-button.current .status-dot {
      background: var(--amber);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--amber) 20%, transparent);
    }

    .map-button-title {
      display: block;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
    }

    .map-button-meta {
      display: block;
      margin-top: 2px;
      color: var(--ink-soft);
      font-size: 11px;
    }

    .map-button-arrow {
      color: var(--ink-soft);
      font-size: 15px;
    }

    .workspace {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      background: var(--surface-soft);
    }

    .workspace-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: end;
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .breadcrumbs {
      display: flex;
      gap: 6px;
      align-items: center;
      min-height: 24px;
      margin-bottom: 5px;
      color: var(--ink-soft);
      font-size: 12px;
    }

    .context-chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-strong);
      color: var(--ink-soft);
      font-weight: 700;
    }

    .workspace-title {
      margin: 0;
      font-family: ui-serif, "Songti SC", "STSong", serif;
      font-size: clamp(19px, 2.3vw, 28px);
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    .workspace-summary {
      max-width: 70ch;
      margin: 5px 0 0;
      color: var(--ink-soft);
      font-size: 13px;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .control-button {
      display: inline-grid;
      min-width: 44px;
      min-height: 44px;
      place-items: center;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-strong);
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
      transition:
        border-color var(--motion),
        background var(--motion);
    }

    .control-button:hover {
      border-color: var(--blue);
      background: var(--blue-soft);
    }

    #collapse-all[hidden] {
      display: none;
    }

    .graph-viewport {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 1.2px)
        0 0 / 24px 24px,
        var(--surface-strong);
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .graph-viewport.dragging {
      cursor: grabbing;
    }

    .graph-svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .flow-line {
      fill: none;
      stroke: var(--line-strong);
      stroke-width: 2;
      marker-end: url("#arrowhead");
      transition:
        stroke var(--motion),
        opacity var(--motion),
        stroke-width var(--motion);
    }

    .flow-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 18;
      cursor: pointer;
      pointer-events: stroke;
    }

    .flow-group.selected .flow-line,
    .flow-group.highlighted .flow-line {
      stroke: var(--blue);
      stroke-width: 3.2;
    }

    .flow-group.dimmed,
    .argument-node.dimmed,
    .inference-junction.dimmed {
      opacity: 0.14;
    }

    .argument-node,
    .inference-junction {
      cursor: pointer;
      outline: none;
      transition: opacity var(--motion);
    }

    .argument-node {
      --node-bg: var(--default-bg);
      --node-fg: var(--default-fg);
      --node-muted: var(--default-muted);
      --node-border: var(--default-border);
    }

    .argument-node.objection {
      --node-bg: var(--objection-bg);
      --node-fg: var(--objection-fg);
      --node-muted: var(--objection-muted);
      --node-border: var(--objection-border);
    }

    .argument-node.boundary {
      --node-bg: var(--boundary-bg);
      --node-fg: var(--boundary-fg);
      --node-muted: var(--boundary-muted);
      --node-border: var(--boundary-border);
    }

    /* Visual role wins over semantic type for compound nodes. */
    .argument-node.conclusion {
      --node-bg: var(--conclusion-bg);
      --node-fg: var(--conclusion-fg);
      --node-muted: var(--conclusion-muted);
      --node-border: var(--conclusion-border);
    }

    .node-surface {
      fill: var(--node-bg);
      stroke: var(--node-border);
      stroke-width: 1.6;
      filter: url("#card-shadow");
    }

    .argument-node.current .node-surface {
      stroke: var(--amber);
      stroke-width: 3.4;
    }

    .argument-node.selected .node-surface {
      stroke: var(--focus);
      stroke-width: 3.4;
    }

    .node-type {
      fill: var(--node-muted);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 0.06em;
    }

    .node-title {
      fill: var(--node-fg);
      font-family: ui-serif, "Songti SC", "STSong", serif;
      font-size: 15px;
      font-weight: 700;
    }

    .node-status {
      fill: var(--node-muted);
      font-size: 10px;
      font-weight: 700;
    }

    .inference-junction {
      --junction-surface-bg: var(--junction-bg);
      --junction-surface-fg: var(--junction-fg);
      --junction-surface-muted: var(--junction-muted);
      --junction-surface-border: var(--junction-border);
    }

    .inference-junction.objects {
      --junction-surface-bg: var(--junction-objection-bg);
      --junction-surface-fg: var(--junction-objection-fg);
      --junction-surface-muted: var(--junction-objection-muted);
      --junction-surface-border: var(--junction-objection-border);
    }

    .inference-junction.responds,
    .inference-junction.limits {
      --junction-surface-bg: var(--junction-boundary-bg);
      --junction-surface-fg: var(--junction-boundary-fg);
      --junction-surface-muted: var(--junction-boundary-muted);
      --junction-surface-border: var(--junction-boundary-border);
    }

    .subargument-surface {
      fill: var(--blue-soft);
      stroke: color-mix(in srgb, var(--blue) 55%, transparent);
      stroke-width: 1;
    }

    .subargument-toggle {
      cursor: pointer;
    }

    .subargument-toggle text {
      fill: var(--blue-deep);
      font-size: 11px;
      font-weight: 800;
      text-anchor: middle;
    }

    .subargument-toggle.expanded .subargument-surface {
      fill: var(--junction-boundary-bg);
      stroke: var(--junction-boundary-border);
    }

    .subargument-toggle.expanded text {
      fill: var(--junction-boundary-fg);
    }

    .junction-surface {
      fill: var(--junction-surface-bg);
      stroke: var(--junction-surface-border);
      stroke-width: 1.4;
      filter: url("#card-shadow");
    }

    .inference-junction.selected .junction-surface {
      stroke: var(--focus);
      stroke-width: 3;
    }

    .junction-kicker {
      fill: var(--junction-surface-muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .junction-text {
      fill: var(--junction-surface-fg);
      font-size: 12px;
      font-weight: 650;
    }

    .inspector {
      min-height: 0;
      overflow: auto;
      padding: 20px 18px 32px;
      border-left: 1px solid var(--line);
      background: var(--surface);
      scrollbar-gutter: stable;
    }

    .inspector-label {
      margin: 0 0 8px;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .inspector h2 {
      margin: 0 0 8px;
      font-family: ui-serif, "Songti SC", "STSong", serif;
      font-size: 21px;
      line-height: 1.38;
    }

    .inspector-lead {
      margin: 0 0 18px;
      color: var(--ink-soft);
      font-size: 13px;
    }

    .inspector-section {
      padding: 16px 0;
      border-top: 1px solid var(--line);
    }

    .inspector-section h3 {
      margin: 0 0 7px;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.04em;
    }

    .inspector-section p,
    .inspector-section ul {
      margin: 0;
      font-size: 13px;
    }

    .inspector-section ul {
      padding-left: 20px;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 15px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-soft);
      font-size: 11px;
      font-weight: 750;
    }

    .inspector-action {
      width: 100%;
      min-height: 46px;
      margin-top: 16px;
      padding: 10px 14px;
      border: 0;
      border-radius: 10px;
      background: var(--blue-deep);
      color: #ffffff;
      cursor: pointer;
      font-weight: 800;
    }

    .mobile-map-select {
      display: none;
      width: calc(100% - 28px);
      min-height: 46px;
      margin: 12px 14px 0;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-strong);
      color: var(--ink);
    }

    .empty-map {
      display: none;
      position: absolute;
      inset: 0;
      place-items: center;
      padding: 30px;
      text-align: center;
    }

    .empty-map.visible {
      display: grid;
    }

    .empty-map-card {
      max-width: 520px;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .empty-map-card h3 {
      margin: 0 0 8px;
      font-family: ui-serif, "Songti SC", serif;
      font-size: 22px;
    }

    .empty-map-card p {
      margin: 0;
      color: var(--ink-soft);
    }

    @media (max-width: 1100px) {
      .app,
      .topbar {
        grid-template-columns: 228px minmax(0, 1fr);
      }

      .progress {
        display: none;
      }

      .inspector {
        position: fixed;
        z-index: 20;
        right: 16px;
        bottom: 16px;
        width: min(360px, calc(100vw - 32px));
        max-height: min(70dvh, 620px);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
    }

    @media (max-width: 760px) {
      body {
        overflow: auto;
      }

      .app {
        display: block;
        height: auto;
        min-height: 100dvh;
      }

      .topbar {
        display: block;
        min-height: auto;
      }

      .brand {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .reading-rule {
        justify-content: flex-start;
        padding-block: 10px;
      }

      .rule-chip {
        white-space: normal;
      }

      .navigator {
        display: none;
      }

      .mobile-map-select {
        display: block;
      }

      .workspace {
        display: block;
        margin-top: 12px;
      }

      .workspace-head {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .controls {
        flex-wrap: wrap;
      }

      .graph-viewport {
        height: 64dvh;
        min-height: 480px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .inspector {
        position: static;
        width: auto;
        max-height: none;
        border: 0;
        border-top: 1px solid var(--line);
        border-radius: 0;
        box-shadow: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body
  data-sml-version="5"
  data-course-id="{{COURSE_ID}}"
  data-revision="{{REVISION}}"
  data-current-node="{{CURRENT_NODE_ID}}"
>
  <a class="skip-link" href="#graph-viewport">跳到论证图</a>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">论</div>
        <div class="brand-copy">
          <p class="eyebrow">Socratic Argument Atlas</p>
          <h1>{{COURSE_TITLE}}</h1>
        </div>
      </div>
      <div class="reading-rule">
        <div class="rule-chip">
          <span>左边是结论</span>
          <span class="rule-arrow" aria-hidden="true">←</span>
          <span>右边是理由</span>
        </div>
      </div>
      <div class="progress">
        <div>
          <div class="progress-number" id="node-progress">0 / 0</div>
          <div class="progress-copy">已掌握命题</div>
        </div>
        <div>
          <div class="progress-number" id="inference-progress">0 / 0</div>
          <div class="progress-copy">已掌握推理</div>
        </div>
      </div>
    </header>

    <aside class="navigator" aria-label="论证导航">
      <p class="nav-heading">论证目录</p>
      <p class="nav-help">这里只切换独立主论证；子论证直接在父图中展开。</p>
      <div class="map-list" id="argument-list"></div>
    </aside>

    <select
      class="mobile-map-select"
      id="mobile-map-select"
      aria-label="选择论证"
    ></select>

    <main class="workspace" id="main-content">
      <div class="workspace-head">
        <div>
          <nav class="breadcrumbs" id="breadcrumbs" aria-label="当前位置"></nav>
          <h2 class="workspace-title" id="map-question">论证问题</h2>
          <p class="workspace-summary" id="map-summary"></p>

            −
          </button>

            适合画布
          </button>
          <button class="control-button" id="zoom-in" type="button" aria-label="放大">
            ＋
          </button>

      <div
        class="graph-viewport"
        id="graph-viewport"
        tabindex="0"
        aria-label="论证画布。右侧理由通过推理关节指向左侧结论。可拖动平移，滚轮缩放。"
      >
        <svg
          class="graph-svg"
          id="graph-svg"
          role="img"
          aria-labelledby="map-question graph-description"
        >
          <desc id="graph-description">
            这是一张从右向左阅读的论证图。命题先进入带有推理说明的关节，再推出左侧结论。
          </desc>
          <defs>
            <marker
              id="arrowhead"
              markerWidth="9"

              <feDropShadow
                dx="0"
                dy="5"
                stdDeviation="6"

                flood-opacity="0.12"
              ></feDropShadow>
            </filter>

          <div class="empty-map-card">
            <h3>这个问题尚未展开</h3>
            <p>这里只显示未来要解决的问题，不提前泄露它的详细答案。</p>

    <aside class="inspector" id="inspector" aria-live="polite">
      <p class="inspector-label" id="inspector-label">阅读方法</p>

      <p class="inspector-lead" id="inspector-lead">
        先读最右边的理由，再读中间的推理关节，最后看它如何推出左边的结论。
      </p>

        <p id="inspector-detail">选择一个命题或推理关节查看依据。</p>
      </div>

        <p id="inspector-source">来源会随选择显示。</p>
      </div>

        <p id="inspector-mastery">能够不用图复述“因为—所以”的连接。</p>

  <script type="application/json" id="graph-data">{{GRAPH_DATA}}</script>
  <script>
    (() => {
      "use strict";

      const data = JSON.parse(
        document.getElementById("graph-data").textContent
      );
      const atlas = data.argument_atlas;
      const nodeById = new Map(data.nodes.map((node) => [node.id, node]));
      const mapById = new Map(atlas.maps.map((map) => [map.id, map]));
      const inferenceById = new Map(
        atlas.inferences.map((inference) => [inference.id, inference])
      );
      const childrenByEntry = new Map();
      const childrenByParent = new Map();
      atlas.maps.forEach((map) => {
        if (map.parent_id && map.entry_node_id) {
          childrenByEntry.set(
            `${map.parent_id}:${map.entry_node_id}`,
            map
          );
          const siblings = childrenByParent.get(map.parent_id) || [];
          siblings.push(map);
          childrenByParent.set(map.parent_id, siblings);
        }
      });

      const elements = {
        argumentList: document.getElementById("argument-list"),
        mobileMapSelect: document.getElementById("mobile-map-select"),
        breadcrumbs: document.getElementById("breadcrumbs"),
        mapQuestion: document.getElementById("map-question"),
        mapSummary: document.getElementById("map-summary"),
        graphViewport: document.getElementById("graph-viewport"),
        graphSvg: document.getElementById("graph-svg"),
        graphCamera: document.getElementById("graph-camera"),
        flowLayer: document.getElementById("flow-layer"),
        inferenceLayer: document.getElementById("inference-layer"),
        nodeLayer: document.getElementById("node-layer"),
        clipDefs: document.getElementById("node-clip-defs"),
        emptyMap: document.getElementById("empty-map"),
        collapseAll: document.getElementById("collapse-all"),
        zoomOut: document.getElementById("zoom-out"),
        zoomIn: document.getElementById("zoom-in"),
        fitGraph: document.getElementById("fit-graph"),
        nodeProgress: document.getElementById("node-progress"),
        inferenceProgress: document.getElementById("inference-progress"),
        inspectorLabel: document.getElementById("inspector-label"),
        inspectorTitle: document.getElementById("inspector-title"),
        inspectorLead: document.getElementById("inspector-lead"),
        inspectorTags: document.getElementById("inspector-tags"),
        inspectorDetail: document.getElementById("inspector-detail"),
        inspectorSource: document.getElementById("inspector-source"),
        inspectorMastery: document.getElementById("inspector-mastery"),
        toggleSubargument: document.getElementById("toggle-subargument")
      };

      const statusLabels = {
        mastered: "已掌握",
        current: "正在学习",
        future: "尚未展开"
      };
      const roleLabels = {
        conclusion: "最终结论",
        intermediate: "中间结论",
        premise: "前提",
        objection: "关键反驳",
        boundary: "适用边界"
      };
      const inferenceKindLabels = {
        supports: "推理关节",
        objects: "反驳关节",
        responds: "回应关节",
        limits: "限定关节"
      };
      const masteryLabels = {
        unassessed: "尚未检验",
        understood: "能够看图解释",
        reconstructable: "能够脱离图复原",
        transferable: "能够迁移应用",
        retained: "延时后仍能复原"
      };

      let activeMapId = data.current.map_id ||
        atlas.default_map_id ||
        atlas.maps.find((map) => map.status !== "future")?.id ||
        "";
      let selectedNodeId = "";
      let selectedInferenceId = "";
      let currentLayout = null;
      let currentGraph = null;
      let view = { x: 0, y: 0, scale: 1 };
      const savedViews = new Map();
      const expandedMapIds = new Set();
      let historyIndex = 0;
      let pan = null;
      let suppressNextClick = false;

      function svgElement(name, attributes = {}) {
        const element = document.createElementNS(
          "http://www.w3.org/2000/svg",
          name
        );
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        return element;
      }

      function glyphWidthFactor(char) {
        if (/[\u2e80-\u9fff\uf900-\ufaff]/u.test(char)) return 1;
        if (/\s/u.test(char)) return 0.34;
        if (/[ilI1|.,:;'"`!]/u.test(char)) return 0.34;
        if (/[MW@#%&]/u.test(char)) return 0.9;
        if (/[A-Z0-9]/u.test(char)) return 0.64;
        return 0.56;
      }

      function estimateTextWidth(value, fontSize = 15) {
        return [...String(value)].reduce(
          (width, char) => width + glyphWidthFactor(char) * fontSize,
          0
        );
      }

      function textTokens(value) {
        const result = [];
        let latin = "";
        const flush = () => {
          if (latin) {
            result.push(latin);
            latin = "";
          }
        };
        [...String(value)].forEach((char) => {
          if (/[\u2e80-\u9fff\uf900-\ufaff]/u.test(char)) {
            flush();
            result.push(char);
          } else if (/\s/u.test(char)) {
            flush();
            result.push(char);
          } else {
            latin += char;
          }
        });
        flush();
        return result;
      }

      function breakToken(token, maxWidth, fontSize) {
        const parts = [];
        let part = "";
        [...token].forEach((char) => {
          if (
            part &&
            estimateTextWidth(part + char, fontSize) > maxWidth
          ) {
            parts.push(part);
            part = char;
          } else {
            part += char;
          }
        });
        if (part) parts.push(part);
        return parts;
      }

      function wrapTextToWidth(value, maxWidth, fontSize = 15) {
        const lines = [];
        let line = "";
        textTokens(value).forEach((token) => {
          const parts =
            estimateTextWidth(token, fontSize) > maxWidth
              ? breakToken(token, maxWidth, fontSize)
              : [token];
          parts.forEach((part) => {
            const candidate = line + part;
            if (
              line &&
              estimateTextWidth(candidate, fontSize) > maxWidth
            ) {
              lines.push(line.trimEnd());
              line = part.trimStart();
            } else {
              line = candidate;
            }
          });
        });
        if (line || !lines.length) lines.push(line.trimEnd());
        return lines;
      }

      function rootMapId(mapId) {
        return parentChain(mapId)[0]?.id || mapId;
      }

      function removeExpandedBranch(mapId) {
        expandedMapIds.delete(mapId);
        (childrenByParent.get(mapId) || []).forEach((child) =>
          removeExpandedBranch(child.id)
        );
      }

      function setExpandedPath(mapId) {
        expandedMapIds.clear();
        parentChain(mapId)
          .slice(1)
          .forEach((map) => expandedMapIds.add(map.id));
      }

      function applyExpandedMapIds(mapIds) {
        expandedMapIds.clear();
        [...mapIds]
          .map((id) => mapById.get(id))
          .filter(
            (map) =>
              map?.parent_id &&
              rootMapId(map.id) === activeMapId
          )
          .sort(
            (first, second) =>
              parentChain(first.id).length -
              parentChain(second.id).length
          )
          .forEach((map) => {
            if (
              map.parent_id === activeMapId ||
              expandedMapIds.has(map.parent_id)
            ) {
              (childrenByParent.get(map.parent_id) || [])
                .filter((sibling) => sibling.id !== map.id)
                .forEach((sibling) =>
                  removeExpandedBranch(sibling.id)
                );
              expandedMapIds.add(map.id);
            }
          });
      }

      function composeArgumentGraph(rootMap) {
        const mapIds = [];
        const nodeIds = [];
        const nodeIdSet = new Set();
        const inferences = [];
        const childByEntry = new Map();

        const visit = (argumentMap) => {
          mapIds.push(argumentMap.id);
          argumentMap.node_ids.forEach((nodeId) => {
            if (!nodeIdSet.has(nodeId)) {
              nodeIdSet.add(nodeId);
              nodeIds.push(nodeId);
            }
          });
          atlas.inferences
            .filter((inference) => inference.map_id === argumentMap.id)
            .forEach((inference) => inferences.push(inference));
          (childrenByParent.get(argumentMap.id) || []).forEach((child) => {
            childByEntry.set(child.entry_node_id, child);
            if (expandedMapIds.has(child.id)) visit(child);
          });
        };
        visit(rootMap);
        return {
          mapIds,
          nodeIds,
          nodes: nodeIds.map((id) => nodeById.get(id)).filter(Boolean),
          inferences,
          childByEntry
        };
      }

      function childMapForNode(nodeId) {
        return currentGraph?.childByEntry.get(nodeId) || null;
      }

      function argumentRoles(argumentMap, inferences) {
        const produced = new Set(
          inferences.map((inference) => inference.conclusion_id)
        );
        const used = new Set(
          inferences.flatMap((inference) => inference.premise_ids)
        );
        const roles = new Map();
        argumentMap.node_ids.forEach((nodeId) => {
          const node = nodeById.get(nodeId);
          let role = "premise";
          if (nodeId === argumentMap.conclusion_id) role = "conclusion";
          else if (node?.node_type === "objection") role = "objection";
          else if (node?.node_type === "boundary") role = "boundary";
          else if (produced.has(nodeId) && used.has(nodeId)) {
            role = "intermediate";
          }
          roles.set(nodeId, role);
        });
        return roles;
      }

      function nodeMetrics(
        node,
        role = "premise",
        hasSubmap = false
      ) {
        const width = role === "conclusion" ? 304 : 278;
        const fontSize = 15;
        const lines = wrapTextToWidth(node.title, width - 34, fontSize);
        const height =
          52 +
          Math.max(1, lines.length) * 22 +
          (hasSubmap ? 40 : 14);
        return {
          width,
          height,
          fontSize,
          lineHeight: 22,
          lines,
          titleY: 49,
          hasSubmap
        };
      }

      function inferenceMetrics(inference) {
        const width = 218;
        const fontSize = 12;
        const lines = wrapTextToWidth(
          inference.bridge,
          width - 30,
          fontSize
        );
        return {
          width,
          height: 50 + Math.max(1, lines.length) * 18,
          fontSize,
          lineHeight: 18,
          lines,
          titleY: 45
        };
      }

      function argumentLayout(
        argumentMap,
        nodes,
        inferences,
        childEntryIds = new Set()
      ) {
        const items = new Map();
        const roles = argumentRoles(argumentMap, inferences);
        nodes.forEach((node) => {
          items.set(node.id, {
            id: node.id,
            kind: "node",
            data: node,
            role: roles.get(node.id) || "premise",
            metrics: nodeMetrics(
              node,
              roles.get(node.id),
              childEntryIds.has(node.id)
            )
          });
        });
        inferences.forEach((inference) => {
          items.set(inference.id, {
            id: inference.id,
            kind: "inference",
            data: inference,
            role: inference.kind,
            metrics: inferenceMetrics(inference)
          });
        });

        const rank = new Map([[argumentMap.conclusion_id, 0]]);
        for (let pass = 0; pass < items.size * 2; pass += 1) {
          let changed = false;
          inferences.forEach((inference) => {
            if (!rank.has(inference.conclusion_id)) return;
            const inferenceRank = rank.get(inference.conclusion_id) + 1;
            if (
              !rank.has(inference.id) ||
              rank.get(inference.id) < inferenceRank
            ) {
              rank.set(inference.id, inferenceRank);
              changed = true;
            }
            inference.premise_ids.forEach((premiseId) => {
              const premiseRank = inferenceRank + 1;
              if (
                !rank.has(premiseId) ||
                rank.get(premiseId) < premiseRank
              ) {
                rank.set(premiseId, premiseRank);
                changed = true;
              }
            });
          });
          if (!changed) break;
        }
        let fallbackRank = Math.max(0, ...rank.values()) + 1;
        items.forEach((_, id) => {
          if (!rank.has(id)) {
            rank.set(id, fallbackRank);
            fallbackRank += 1;
          }
        });

        const targets = new Map();
        inferences.forEach((inference) => {
          targets.set(inference.id, [inference.conclusion_id]);
          inference.premise_ids.forEach((premiseId) => {
            const values = targets.get(premiseId) || [];
            values.push(inference.id);
            targets.set(premiseId, values);
          });
        });

        const columns = new Map();
        items.forEach((item, id) => {
          const itemRank = rank.get(id);
          const values = columns.get(itemRank) || [];
          values.push(item);
          columns.set(itemRank, values);
        });
        const orderedRanks = [...columns.keys()].sort((a, b) => a - b);
        const orderIndex = new Map();
        const nodeOrder = new Map(
          argumentMap.node_ids.map((nodeId, index) => [nodeId, index])
        );
        orderedRanks.forEach((itemRank) => {
          const values = columns.get(itemRank);
          values.sort((first, second) => {
            const targetAverage = (item) => {
              const linked = targets.get(item.id) || [];
              const indices = linked
                .map((id) => orderIndex.get(id))
                .filter((value) => Number.isFinite(value));
              if (indices.length) {
                return indices.reduce((sum, value) => sum + value, 0) /
                  indices.length;
              }
              return nodeOrder.get(item.id) ?? 999;
            };
            return targetAverage(first) - targetAverage(second) ||
              first.id.localeCompare(second.id);
          });
          values.forEach((item, index) => orderIndex.set(item.id, index));
        });

        const xByRank = new Map();
        let nextX = 90;
        orderedRanks.forEach((itemRank) => {
          xByRank.set(itemRank, nextX);
          const maxWidth = Math.max(
            ...columns.get(itemRank).map((item) => item.metrics.width)
          );
          nextX += maxWidth + 170;
        });

        const columnHeights = new Map();
        orderedRanks.forEach((itemRank) => {
          const values = columns.get(itemRank);
          const height =
            values.reduce((sum, item) => sum + item.metrics.height, 0) +
            Math.max(0, values.length - 1) * 70;
          columnHeights.set(itemRank, height);
        });
        const maxColumnHeight = Math.max(0, ...columnHeights.values());
        const positions = new Map();
        orderedRanks.forEach((itemRank) => {
          const values = columns.get(itemRank);
          let y = 90 + (maxColumnHeight - columnHeights.get(itemRank)) / 2;
          values.forEach((item) => {
            positions.set(item.id, {
              x: xByRank.get(itemRank),
              y,
              width: item.metrics.width,
              height: item.metrics.height,
              metrics: item.metrics,
              kind: item.kind,
              role: item.role
            });
            y += item.metrics.height + 70;
          });
        });

        const flows = [];
        inferences.forEach((inference) => {
          inference.premise_ids.forEach((premiseId) => {
            flows.push({
              id: `flow-${inference.id}-${premiseId}`,
              inferenceId: inference.id,
              from: premiseId,
              to: inference.id
            });
          });
          flows.push({
            id: `flow-${inference.id}-conclusion`,
            inferenceId: inference.id,
            from: inference.id,
            to: inference.conclusion_id
          });
        });

        return {
          positions,
          flows,
          roles,
          width: nextX + 100,
          height: maxColumnHeight + 180
        };
      }

      function flowPath(source, target) {
        const startX = source.x;
        const startY = source.y + source.height / 2;
        const endX = target.x + target.width;
        const endY = target.y + target.height / 2;
        const bend = Math.max(62, (startX - endX) * 0.42);
        return (
          `M${startX},${startY} ` +
          `C${startX - bend},${startY} ` +
          `${endX + bend},${endY} ${endX},${endY}`
        );
      }

      function createFlow(flow) {
        const source = currentLayout.positions.get(flow.from);
        const target = currentLayout.positions.get(flow.to);
        if (!source || !target) return;
        const pathData = flowPath(source, target);
        const group = svgElement("g", {
          class: "flow-group",
          "data-inference-id": flow.inferenceId
        });
        const path = svgElement("path", {
          class: "flow-line",
          d: pathData
        });
        const hit = svgElement("path", {
          class: "flow-hit",
          d: pathData,
          tabindex: "0",
          role: "button",
          "aria-label": "选择这一步推理"
        });
        const activate = () => selectInference(flow.inferenceId);
        hit.addEventListener("click", activate);
        hit.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            activate();
          }
        });
        group.append(path, hit);
        elements.flowLayer.appendChild(group);
      }

      function appendWrappedText(
        textElement,
        lines,
        x,
        y,
        lineHeight
      ) {
        lines.forEach((line, index) => {
          const tspan = svgElement("tspan", {
            x,
            y: y + index * lineHeight
          });
          tspan.textContent = line;
          textElement.appendChild(tspan);
        });
      }

      function createInference(inference) {
        const position = currentLayout.positions.get(inference.id);
        if (!position) return;
        const group = svgElement("g", {
          class: `inference-junction ${inference.kind}`,
          transform: `translate(${position.x},${position.y})`,
          "data-inference-id": inference.id,
          tabindex: "0",
          role: "button",
          "aria-label": `推理：${inference.bridge}`
        });
        const rect = svgElement("rect", {
          class: "junction-surface",
          width: position.width,
          height: position.height,
          rx: 13
        });
        const kicker = svgElement("text", {
          class: "junction-kicker",
          x: 15,
          y: 22
        });
        kicker.textContent = inferenceKindLabels[inference.kind] || "推理关节";
        const text = svgElement("text", {
          class: "junction-text"
        });
        appendWrappedText(
          text,
          position.metrics.lines,
          15,
          position.metrics.titleY,
          position.metrics.lineHeight
        );
        const activate = () => selectInference(inference.id);
        group.addEventListener("click", activate);
        group.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            activate();
          }
        });
        group.append(rect, kicker, text);
        elements.inferenceLayer.appendChild(group);
      }

      function createNode(node, role) {
        const position = currentLayout.positions.get(node.id);
        if (!position) return;
        const childMap = childMapForNode(node.id);
        const childExpanded = Boolean(
          childMap && expandedMapIds.has(childMap.id)
        );
        const classes = [
          "argument-node",
          role,
          node.node_type,
          node.status
        ].join(" ");
        const group = svgElement("g", {
          class: classes,
          transform: `translate(${position.x},${position.y})`,
          "data-node-id": node.id,
          tabindex: "0",
          role: "button",
          "aria-label": `${roleLabels[role] || "命题"}：${node.title}`
        });
        const title = svgElement("title");
        title.textContent = node.title;
        const rect = svgElement("rect", {
          class: "node-surface",
          width: position.width,
          height: position.height,
          rx: 14
        });
        const type = svgElement("text", {
          class: "node-type",
          x: 17,
          y: 23
        });
        type.textContent = roleLabels[role] || "命题";
        const text = svgElement("text", {
          class: "node-title"
        });
        appendWrappedText(
          text,
          position.metrics.lines,
          17,
          position.metrics.titleY,
          position.metrics.lineHeight
        );
        const status = svgElement("text", {
          class: "node-status",
          x: 17,
          y: position.height - 15
        });
        status.textContent = statusLabels[node.status] || "";
        group.append(title, rect, type, text, status);

        if (childMap) {
          const triggerWidth = 112;
          const triggerHeight = 28;
          const trigger = svgElement("g", {
            class:
              `subargument-toggle ${childExpanded ? "expanded" : ""}`,
            transform:
              `translate(${position.width - triggerWidth - 12},` +
              `${position.height - triggerHeight - 8})`,
            tabindex: "0",
            role: "button",
            "aria-expanded": String(childExpanded),
            "aria-label":
              `${childExpanded ? "收起" : "展开"}子论证：` +
              `${childMap.question}`
          });
          const triggerRect = svgElement("rect", {
            class: "subargument-surface",
            width: triggerWidth,
            height: triggerHeight,
            rx: 8
          });
          const triggerText = svgElement("text", {
            x: triggerWidth / 2,
            y: 19
          });
          triggerText.textContent = childExpanded
            ? "收起子论证  −"
            : "展开子论证  ＋";
          const toggle = (event) => {
            event.stopPropagation();
            toggleSubargument(childMap, node.id);
          };
          trigger.addEventListener("click", toggle);
          trigger.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              toggle(event);
            }
          });
          trigger.append(triggerRect, triggerText);
          group.appendChild(trigger);
        }

        const activate = () => {
          if (suppressNextClick) {
            suppressNextClick = false;
            return;
          }
          selectNode(node.id);
        };
        group.addEventListener("click", activate);
        group.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            activate();
          }
        });
        elements.nodeLayer.appendChild(group);
      }

      function clearGraph() {
        elements.flowLayer.replaceChildren();
        elements.inferenceLayer.replaceChildren();
        elements.nodeLayer.replaceChildren();
        elements.clipDefs.replaceChildren();
      }

      function renderGraph({ restore = false, anchor = null } = {}) {
        clearGraph();
        const argumentMap = mapById.get(activeMapId);
        if (!argumentMap) return;
        currentGraph = composeArgumentGraph(argumentMap);
        const nodes = currentGraph.nodes;
        const inferences = currentGraph.inferences;
        const empty = argumentMap.status === "future" || !nodes.length;
        elements.emptyMap.classList.toggle("visible", empty);
        elements.graphSvg.style.visibility = empty ? "hidden" : "visible";
        if (empty) {
          currentLayout = null;
          return;
        }
        const visibleArgument = {
          ...argumentMap,
          node_ids: currentGraph.nodeIds
        };
        currentLayout = argumentLayout(
          visibleArgument,
          nodes,
          inferences,
          new Set(currentGraph.childByEntry.keys())
        );
        currentLayout.flows.forEach(createFlow);
        inferences.forEach(createInference);
        nodes.forEach((node) =>
          createNode(node, currentLayout.roles.get(node.id))
        );
        if (
          anchor &&
          currentLayout.positions.has(anchor.nodeId)
        ) {
          const position = currentLayout.positions.get(anchor.nodeId);
          view = {
            ...view,
            x:
              anchor.x -
              (position.x + position.width / 2) * view.scale,
            y:
              anchor.y -
              (position.y + position.height / 2) * view.scale
          };
          applyView();
        } else if (restore && savedViews.has(activeMapId)) {
          const saved = savedViews.get(activeMapId);
          view = { ...saved.view };
          selectedNodeId = saved.selectedNodeId || "";
          selectedInferenceId = saved.selectedInferenceId || "";
          applyView();
        } else {
          requestAnimationFrame(fitGraph);
        }
        if (selectedNodeId) selectNode(selectedNodeId);
        else if (selectedInferenceId) selectInference(selectedInferenceId);
        else applyHighlights();
        elements.collapseAll.hidden = expandedMapIds.size === 0;
      }

      function renderNavigation() {
        elements.argumentList.replaceChildren();
        elements.mobileMapSelect.replaceChildren();
        [...atlas.maps]
          .filter((argumentMap) => !argumentMap.parent_id)
          .sort((a, b) => a.position - b.position || a.id.localeCompare(b.id))
          .forEach((argumentMap) => {
            const descendants = atlas.maps.filter(
              (candidate) =>
                candidate.parent_id &&
                rootMapId(candidate.id) === argumentMap.id
            );
            const displayStatus = descendants.some(
              (candidate) => candidate.status === "current"
            )
              ? "current"
              : argumentMap.status;
            const button = document.createElement("button");
            button.type = "button";
            button.className = [
              "map-button",
              displayStatus,
              argumentMap.id === activeMapId ? "active" : ""
            ].join(" ");
            button.disabled = argumentMap.status === "future";
            button.setAttribute(
              "aria-current",
              argumentMap.id === activeMapId ? "page" : "false"
            );
            button.innerHTML =
              '<span class="status-dot" aria-hidden="true"></span>' +
              `<span><span class="map-button-title"></span>` +
              `<span class="map-button-meta"></span></span>` +
              '<span class="map-button-arrow" aria-hidden="true">›</span>';
            button.querySelector(".map-button-title").textContent =
              argumentMap.title;
            button.querySelector(".map-button-meta").textContent =
              `${statusLabels[displayStatus]}` +
              `${descendants.length ? ` · ${descendants.length} 个可展开子论证` : ""}`;
            button.addEventListener("click", () =>
              openMap(argumentMap.id)
            );
            elements.argumentList.appendChild(button);

            const option = document.createElement("option");
            option.value = argumentMap.id;
            option.disabled = argumentMap.status === "future";
            option.selected = argumentMap.id === activeMapId;
            option.textContent =
              `${argumentMap.title} · ${statusLabels[displayStatus]}`;
            elements.mobileMapSelect.appendChild(option);
          });
      }

      function parentChain(mapId) {
        const chain = [];
        let cursor = mapById.get(mapId);
        const seen = new Set();
        while (cursor && !seen.has(cursor.id)) {
          seen.add(cursor.id);
          chain.unshift(cursor);
          cursor = cursor.parent_id
            ? mapById.get(cursor.parent_id)
            : null;
        }
        return chain;
      }

      function updateHeader() {
        const argumentMap = mapById.get(activeMapId);
        if (!argumentMap) return;
        elements.mapQuestion.textContent = argumentMap.question;
        elements.mapSummary.textContent = argumentMap.summary;
        elements.breadcrumbs.replaceChildren();
        const rootChip = document.createElement("span");
        rootChip.className = "context-chip";
        rootChip.textContent = "主论证";
        elements.breadcrumbs.appendChild(rootChip);
        if (expandedMapIds.size) {
          const expandedChip = document.createElement("span");
          expandedChip.className = "context-chip";
          expandedChip.textContent =
            `已内联展开 ${expandedMapIds.size} 层子论证`;
          elements.breadcrumbs.appendChild(expandedChip);
        }
        elements.collapseAll.hidden = expandedMapIds.size === 0;
      }

      function updateProgress() {
        const totalNodes = data.progress.nodes.mastered +
          data.progress.nodes.current +
          data.progress.nodes.future;
        elements.nodeProgress.textContent =
          `${data.progress.nodes.mastered} / ${totalNodes}`;
        const visibleInferences = atlas.inferences.filter((inference) => {
          const map = mapById.get(inference.map_id);
          return map && map.status !== "future";
        });
        const masteredInferences = visibleInferences.filter(
          (inference) => inference.mastery_level !== "unassessed"
        ).length;
        elements.inferenceProgress.textContent =
          `${masteredInferences} / ${visibleInferences.length}`;
      }

      function saveActiveView() {
        if (!activeMapId) return;
        savedViews.set(activeMapId, {
          view: { ...view },
          selectedNodeId,
          selectedInferenceId,
          expandedMapIds: [...expandedMapIds]
        });
      }

      function historyHash() {
        const expanded = [...expandedMapIds]
          .sort((first, second) =>
            (mapById.get(first)?.position || 0) -
            (mapById.get(second)?.position || 0)
          )
          .map(encodeURIComponent)
          .join(",");
        return (
          `#map=${encodeURIComponent(activeMapId)}` +
          `${expanded ? `&expand=${expanded}` : ""}`
        );
      }

      function writeHistory(mode = "replace") {
        const payload = {
          argumentAtlas: true,
          mapId: activeMapId,
          expandedMapIds: [...expandedMapIds],
          index: historyIndex
        };
        if (mode === "push") {
          historyIndex += 1;
          payload.index = historyIndex;
          history.pushState(payload, "", historyHash());
        } else {
          history.replaceState(payload, "", historyHash());
        }
      }

      function openMap(mapId, { historyMode = "push" } = {}) {
        const requested = mapById.get(mapId);
        if (!requested || requested.status === "future") return;
        const nextId = rootMapId(mapId);
        const next = mapById.get(nextId);
        if (!next) return;
        if (nextId === activeMapId) {
          if (requested.parent_id) {
            setExpandedPath(requested.id);
            updateHeader();
            resetInspector();
            renderGraph();
            writeHistory("replace");
          }
          return;
        }
        saveActiveView();
        activeMapId = nextId;
        selectedNodeId = "";
        selectedInferenceId = "";
        expandedMapIds.clear();
        const saved = savedViews.get(activeMapId);
        if (requested.parent_id) {
          setExpandedPath(requested.id);
        } else if (saved?.expandedMapIds) {
          applyExpandedMapIds(saved.expandedMapIds);
        }
        writeHistory(historyMode);
        renderNavigation();
        updateHeader();
        resetInspector();
        renderGraph({ restore: true });
      }

      function captureNodeAnchor(nodeId) {
        const position = currentLayout?.positions.get(nodeId);
        if (!position) return null;
        return {
          nodeId,
          x: view.x + (position.x + position.width / 2) * view.scale,
          y: view.y + (position.y + position.height / 2) * view.scale
        };
      }

      function toggleSubargument(childMap, entryNodeId) {
        const anchor = captureNodeAnchor(entryNodeId);
        if (expandedMapIds.has(childMap.id)) {
          removeExpandedBranch(childMap.id);
        } else {
          (childrenByParent.get(childMap.parent_id) || [])
            .filter((sibling) => sibling.id !== childMap.id)
            .forEach((sibling) => removeExpandedBranch(sibling.id));
          expandedMapIds.add(childMap.id);
        }
        selectedNodeId = entryNodeId;
        selectedInferenceId = "";
        updateHeader();
        renderGraph({ anchor });
        writeHistory("replace");
        saveActiveView();
      }

      function collapseAllSubarguments() {
        const rootConclusion = mapById.get(activeMapId)?.conclusion_id;
        const anchor = captureNodeAnchor(rootConclusion);
        expandedMapIds.clear();
        selectedNodeId = rootConclusion || "";
        selectedInferenceId = "";
        updateHeader();
        resetInspector();
        renderGraph({ anchor });
        writeHistory("replace");
        saveActiveView();
      }

      window.addEventListener("popstate", (event) => {
        const state = event.state;
        const requested = state?.argumentAtlas
          ? mapById.get(state.mapId)
          : null;
        const target = requested
          ? mapById.get(rootMapId(requested.id))
          : null;
        if (!target || target.status === "future") return;
        saveActiveView();
        activeMapId = target.id;
        historyIndex = Number.isFinite(state.index) ? state.index : 0;
        applyExpandedMapIds(
          Array.isArray(state.expandedMapIds)
            ? state.expandedMapIds
            : []
        );
        selectedNodeId = "";
        selectedInferenceId = "";
        renderNavigation();
        updateHeader();
        resetInspector();
        renderGraph({ restore: true });
      });

      function tag(text) {
        const element = document.createElement("span");
        element.className = "tag";
        element.textContent = text;
        return element;
      }

      function resetInspector() {
        elements.inspectorLabel.textContent = "阅读方法";
        elements.inspectorTitle.textContent = "从右向左复原论证";
        elements.inspectorLead.textContent =
          "先读右侧理由，再读推理关节，最后检查左侧结论是否真的被推出。";
        elements.inspectorTags.replaceChildren(
          tag("理由 → 推理 → 结论")
        );
        elements.inspectorDetail.textContent =
          "定义、例子和来源不再占据主图；选择命题后在这里查看。";
        elements.inspectorSource.textContent =
          mapById.get(activeMapId)?.source || "来源待补充";
        elements.inspectorMastery.textContent =
          "能够遮住图后，完整复述每一步“因为—所以”。";
        elements.toggleSubargument.hidden = true;
        elements.toggleSubargument.onclick = null;
        elements.toggleSubargument.removeAttribute("aria-expanded");
      }

      function selectNode(nodeId) {
        selectedNodeId = nodeId;
        selectedInferenceId = "";
        const node = nodeById.get(nodeId);
        if (!node) return;
        const role = currentLayout?.roles.get(nodeId) || "premise";
        elements.inspectorLabel.textContent = roleLabels[role] || "命题";
        elements.inspectorTitle.textContent = node.title;
        elements.inspectorLead.textContent = node.summary;
        elements.inspectorTags.replaceChildren(
          tag(statusLabels[node.status]),
          tag(roleLabels[role] || "命题")
        );
        elements.inspectorDetail.textContent = node.detail;
        elements.inspectorSource.textContent = node.source;
        elements.inspectorMastery.textContent = node.mastery_criterion;
        const childMap = childMapForNode(nodeId);
        const childExpanded = Boolean(
          childMap && expandedMapIds.has(childMap.id)
        );
        elements.toggleSubargument.hidden = !childMap;
        elements.toggleSubargument.textContent = childExpanded
          ? "收起这个子论证"
          : "展开这个子论证";
        elements.toggleSubargument.setAttribute(
          "aria-expanded",
          String(childExpanded)
        );
        elements.toggleSubargument.onclick = childMap
          ? () => toggleSubargument(childMap, nodeId)
          : null;
        applyHighlights();
      }

      function selectInference(inferenceId) {
        selectedInferenceId = inferenceId;
        selectedNodeId = "";
        const inference = inferenceById.get(inferenceId);
        if (!inference) return;
        const premises = inference.premise_ids
          .map((id) => nodeById.get(id)?.title)
          .filter(Boolean);
        const conclusion = nodeById.get(inference.conclusion_id)?.title || "";
        elements.inspectorLabel.textContent =
          inferenceKindLabels[inference.kind] || "推理关节";
        elements.inspectorTitle.textContent = inference.bridge;
        elements.inspectorLead.textContent =
          `因为：${premises.join("；")}。所以：${conclusion}。`;
        elements.inspectorTags.replaceChildren(
          tag(`${premises.length} 个共同前提`),
          tag(masteryLabels[inference.mastery_level])
        );
        elements.inspectorDetail.textContent =
          "这不是一条表示“相关”的线，而是前提共同推出结论的明确推理步骤。";
        elements.inspectorSource.textContent = inference.source;
        elements.inspectorMastery.textContent =
          "能够说出全部前提，并解释这条推理桥梁为什么成立。";
        elements.toggleSubargument.hidden = true;
        elements.toggleSubargument.onclick = null;
        elements.toggleSubargument.removeAttribute("aria-expanded");
        applyHighlights();
      }

      function applyHighlights() {
        document.querySelectorAll(".argument-node").forEach((group) => {
          group.classList.toggle(
            "selected",
            group.dataset.nodeId === selectedNodeId
          );
          let connected = true;
          if (selectedInferenceId) {
            const inference = inferenceById.get(selectedInferenceId);
            connected =
              inference?.premise_ids.includes(group.dataset.nodeId) ||
              inference?.conclusion_id === group.dataset.nodeId;
          }
          group.classList.toggle(
            "dimmed",
            Boolean(selectedInferenceId && !connected)
          );
        });
        document.querySelectorAll(".inference-junction").forEach((group) => {
          group.classList.toggle(
            "selected",
            group.dataset.inferenceId === selectedInferenceId
          );
          let connected = true;
          if (selectedNodeId) {
            const inference = inferenceById.get(group.dataset.inferenceId);
            connected =
              inference?.premise_ids.includes(selectedNodeId) ||
              inference?.conclusion_id === selectedNodeId;
          }
          group.classList.toggle(
            "dimmed",
            Boolean(selectedNodeId && !connected)
          );
        });
        document.querySelectorAll(".flow-group").forEach((group) => {
          const highlighted =
            group.dataset.inferenceId === selectedInferenceId ||
            (
              selectedNodeId &&
              (() => {
                const inference = inferenceById.get(
                  group.dataset.inferenceId
                );
                return (
                  inference?.premise_ids.includes(selectedNodeId) ||
                  inference?.conclusion_id === selectedNodeId
                );
              })()
            );
          group.classList.toggle("highlighted", Boolean(highlighted));
          group.classList.toggle(
            "dimmed",
            Boolean(
              (selectedNodeId || selectedInferenceId) && !highlighted
            )
          );
        });
      }

      function applyView() {
        elements.graphCamera.setAttribute(
          "transform",
          `translate(${view.x},${view.y}) scale(${view.scale})`
        );
      }

      function setZoomAt(nextScale, clientX, clientY) {
        const rect = elements.graphViewport.getBoundingClientRect();
        const bounded = Math.min(2.4, Math.max(0.28, nextScale));
        const pointerX = clientX - rect.left;
        const pointerY = clientY - rect.top;
        const worldX = (pointerX - view.x) / view.scale;
        const worldY = (pointerY - view.y) / view.scale;
        view = {
          scale: bounded,
          x: pointerX - worldX * bounded,
          y: pointerY - worldY * bounded
        };
        applyView();
        saveActiveView();
      }

      function fitGraph() {
        if (!currentLayout) return;
        const rect = elements.graphViewport.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const padding = 52;
        const scale = Math.min(
          1.05,
          Math.max(
            0.28,
            Math.min(
              (rect.width - padding * 2) / currentLayout.width,
              (rect.height - padding * 2) / currentLayout.height
            )
          )
        );
        view = {
          scale,
          x: (rect.width - currentLayout.width * scale) / 2,
          y: (rect.height - currentLayout.height * scale) / 2
        };
        applyView();
        saveActiveView();
      }

      elements.graphViewport.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || !currentLayout) return;
        pan = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          originX: view.x,
          originY: view.y,
          dragging: false
        };
      });

      elements.graphViewport.addEventListener("pointermove", (event) => {
        if (!pan || pan.pointerId !== event.pointerId) return;
        const dx = event.clientX - pan.startX;
        const dy = event.clientY - pan.startY;
        if (!pan.dragging && Math.hypot(dx, dy) >= 5) {
          pan.dragging = true;
          elements.graphViewport.classList.add("dragging");
          elements.graphViewport.setPointerCapture(event.pointerId);
        }
        if (!pan.dragging) return;
        view.x = pan.originX + dx;
        view.y = pan.originY + dy;
        applyView();
      });

      function finishPan(event) {
        if (!pan || pan.pointerId !== event.pointerId) return;
        const wasDragging = pan.dragging;
        if (
          elements.graphViewport.hasPointerCapture(event.pointerId)
        ) {
          elements.graphViewport.releasePointerCapture(event.pointerId);
        }
        elements.graphViewport.classList.remove("dragging");
        pan = null;
        if (wasDragging) {
          suppressNextClick = true;
          saveActiveView();
          requestAnimationFrame(() => {
            suppressNextClick = false;
          });
        }
      }

      elements.graphViewport.addEventListener("pointerup", finishPan);
      elements.graphViewport.addEventListener("pointercancel", finishPan);
      elements.graphViewport.addEventListener(
        "wheel",
        (event) => {
          if (!currentLayout) return;
          event.preventDefault();
          const factor = Math.exp(-event.deltaY * 0.0015);
          setZoomAt(view.scale * factor, event.clientX, event.clientY);
        },
        { passive: false }
      );

      elements.zoomIn.addEventListener("click", () => {
        const rect = elements.graphViewport.getBoundingClientRect();
        setZoomAt(
          view.scale * 1.18,
          rect.left + rect.width / 2,
          rect.top + rect.height / 2
        );
      });
      elements.zoomOut.addEventListener("click", () => {
        const rect = elements.graphViewport.getBoundingClientRect();
        setZoomAt(
          view.scale / 1.18,
          rect.left + rect.width / 2,
          rect.top + rect.height / 2
        );
      });
      elements.fitGraph.addEventListener("click", fitGraph);
      elements.collapseAll.addEventListener(
        "click",
        collapseAllSubarguments
      );
      elements.mobileMapSelect.addEventListener("change", (event) => {
        openMap(event.target.value);
      });
      window.addEventListener("resize", () => {
        window.clearTimeout(window.__smlResizeTimer);
        window.__smlResizeTimer = window.setTimeout(fitGraph, 120);
      });

      const initialTargetMapId = activeMapId;
      const hashMatch = location.hash.match(/(?:^#|&)map=([^&]+)/);
      let requestedMapId = initialTargetMapId;
      if (hashMatch) {
        const hashMapId = decodeURIComponent(hashMatch[1]);
        if (
          mapById.has(hashMapId) &&
          mapById.get(hashMapId).status !== "future"
        ) {
          requestedMapId = hashMapId;
        }
      }
      activeMapId = rootMapId(requestedMapId);
      const expandMatch = location.hash.match(/(?:^#|&)expand=([^&]+)/);
      if (expandMatch) {
        applyExpandedMapIds(
          decodeURIComponent(expandMatch[1])
            .split(",")
            .filter(Boolean)
        );
      } else if (mapById.get(requestedMapId)?.parent_id) {
        setExpandedPath(requestedMapId);
      }
      writeHistory("replace");

      renderNavigation();
      updateHeader();
      updateProgress();
      resetInspector();
      renderGraph();
    })();
  </script>
</body>
</html>
