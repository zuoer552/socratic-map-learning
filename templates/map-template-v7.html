<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="按作品结构进入单元，并逐个问题复原局部关系。">
  <title>{{PAGE_TITLE}}</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f1e8;
      --surface: #fffdf8;
      --surface-soft: #ece9e0;
      --surface-raised: #ffffff;
      --ink: #18233a;
      --muted: #536078;
      --quiet: #68758a;
      --line: #9aa3b2;
      --line-soft: #d3d6dc;
      --accent: #0f766e;
      --accent-strong: #0b5752;
      --accent-soft: #e1f1ec;
      --amber: #9a5b00;
      --amber-soft: #fff2cf;
      --focus: #b45309;
      --scrim: rgba(10, 18, 32, 0.56);
      --shadow-sm: 0 6px 20px rgba(24, 35, 58, 0.08);
      --shadow-md: 0 18px 52px rgba(24, 35, 58, 0.12);
      --default-bg: #fffdf8;
      --default-fg: #172033;
      --default-muted: #4b5870;
      --default-border: #667085;
      --conclusion-bg: #e9f4ef;
      --conclusion-fg: #123d38;
      --conclusion-muted: #315e58;
      --conclusion-border: #0f766e;
      --objection-bg: #fff0ed;
      --objection-fg: #5e211d;
      --objection-muted: #7a3730;
      --objection-border: #b5473f;
      --boundary-bg: #fff5dc;
      --boundary-fg: #50370a;
      --boundary-muted: #6f5318;
      --boundary-border: #a56a00;
      --junction-bg: #eef3fb;
      --junction-fg: #1b3359;
      --junction-muted: #3f5577;
      --junction-border: #315e9e;
      --junction-objection-bg: #fbecea;
      --junction-objection-fg: #5c211c;
      --junction-objection-muted: #7a3932;
      --junction-objection-border: #a9433b;
      --junction-boundary-bg: #fff3d9;
      --junction-boundary-fg: #503607;
      --junction-boundary-muted: #70541b;
      --junction-boundary-border: #9b6500;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --header-height: 68px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0d1421;
        --surface: #151f2f;
        --surface-soft: #1d293a;
        --surface-raised: #192538;
        --ink: #f4f7fb;
        --muted: #c3cddd;
        --quiet: #aab7ca;
        --line: #7c899e;
        --line-soft: #3d4a5e;
        --accent: #5eead4;
        --accent-strong: #99f6e4;
        --accent-soft: #173d3a;
        --amber: #f6c85f;
        --amber-soft: #493714;
        --focus: #fbbf24;
        --scrim: rgba(0, 0, 0, 0.7);
        --shadow-sm: 0 6px 20px rgba(0, 0, 0, 0.24);
        --shadow-md: 0 18px 52px rgba(0, 0, 0, 0.34);
        --default-bg: #192538;
        --default-fg: #f5f7fb;
        --default-muted: #c2ccdb;
        --default-border: #8492a8;
        --conclusion-bg: #153b38;
        --conclusion-fg: #d8fff8;
        --conclusion-muted: #afe8dd;
        --conclusion-border: #5eead4;
        --objection-bg: #4b2422;
        --objection-fg: #ffe7e3;
        --objection-muted: #ffc5bd;
        --objection-border: #f58b7f;
        --boundary-bg: #473714;
        --boundary-fg: #fff1c2;
        --boundary-muted: #f1d995;
        --boundary-border: #f4c967;
        --junction-bg: #1e3657;
        --junction-fg: #edf5ff;
        --junction-muted: #bed3f0;
        --junction-border: #8cb7eb;
        --junction-objection-bg: #4b2724;
        --junction-objection-fg: #ffe9e5;
        --junction-objection-muted: #ffc8c0;
        --junction-objection-border: #f08f84;
        --junction-boundary-bg: #493814;
        --junction-boundary-fg: #fff3c8;
        --junction-boundary-muted: #f0dc9d;
        --junction-boundary-border: #efc86b;
      }
    }

    body[data-theme="light"] {
      color-scheme: light;
      --page: #f4f1e8;
      --surface: #fffdf8;
      --surface-soft: #ece9e0;
      --surface-raised: #ffffff;
      --ink: #18233a;
      --muted: #536078;
      --quiet: #68758a;
      --line: #9aa3b2;
      --line-soft: #d3d6dc;
      --accent: #0f766e;
      --accent-strong: #0b5752;
      --accent-soft: #e1f1ec;
      --amber: #9a5b00;
      --amber-soft: #fff2cf;
      --focus: #b45309;
      --scrim: rgba(10, 18, 32, 0.56);
      --shadow-sm: 0 6px 20px rgba(24, 35, 58, 0.08);
      --shadow-md: 0 18px 52px rgba(24, 35, 58, 0.12);
      --default-bg: #fffdf8;
      --default-fg: #172033;
      --default-muted: #4b5870;
      --default-border: #667085;
      --conclusion-bg: #e9f4ef;
      --conclusion-fg: #123d38;
      --conclusion-muted: #315e58;
      --conclusion-border: #0f766e;
      --objection-bg: #fff0ed;
      --objection-fg: #5e211d;
      --objection-muted: #7a3730;
      --objection-border: #b5473f;
      --boundary-bg: #fff5dc;
      --boundary-fg: #50370a;
      --boundary-muted: #6f5318;
      --boundary-border: #a56a00;
      --junction-bg: #eef3fb;
      --junction-fg: #1b3359;
      --junction-muted: #3f5577;
      --junction-border: #315e9e;
      --junction-objection-bg: #fbecea;
      --junction-objection-fg: #5c211c;
      --junction-objection-muted: #7a3932;
      --junction-objection-border: #a9433b;
      --junction-boundary-bg: #fff3d9;
      --junction-boundary-fg: #503607;
      --junction-boundary-muted: #70541b;
      --junction-boundary-border: #9b6500;
    }

    body[data-theme="dark"] {
      color-scheme: dark;
      --page: #0d1421;
      --surface: #151f2f;
      --surface-soft: #1d293a;
      --surface-raised: #192538;
      --ink: #f4f7fb;
      --muted: #c3cddd;
      --quiet: #aab7ca;
      --line: #7c899e;
      --line-soft: #3d4a5e;
      --accent: #5eead4;
      --accent-strong: #99f6e4;
      --accent-soft: #173d3a;
      --amber: #f6c85f;
      --amber-soft: #493714;
      --focus: #fbbf24;
      --scrim: rgba(0, 0, 0, 0.7);
      --shadow-sm: 0 6px 20px rgba(0, 0, 0, 0.24);
      --shadow-md: 0 18px 52px rgba(0, 0, 0, 0.34);
      --default-bg: #192538;
      --default-fg: #f5f7fb;
      --default-muted: #c2ccdb;
      --default-border: #8492a8;
      --conclusion-bg: #153b38;
      --conclusion-fg: #d8fff8;
      --conclusion-muted: #afe8dd;
      --conclusion-border: #5eead4;
      --objection-bg: #4b2422;
      --objection-fg: #ffe7e3;
      --objection-muted: #ffc5bd;
      --objection-border: #f58b7f;
      --boundary-bg: #473714;
      --boundary-fg: #fff1c2;
      --boundary-muted: #f1d995;
      --boundary-border: #f4c967;
      --junction-bg: #1e3657;
      --junction-fg: #edf5ff;
      --junction-muted: #bed3f0;
      --junction-border: #8cb7eb;
      --junction-objection-bg: #4b2724;
      --junction-objection-fg: #ffe9e5;
      --junction-objection-muted: #ffc8c0;
      --junction-objection-border: #f08f84;
      --junction-boundary-bg: #493814;
      --junction-boundary-fg: #fff3c8;
      --junction-boundary-muted: #f0dc9d;
      --junction-boundary-border: #efc86b;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      background: var(--page);
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 75% -10%, var(--accent-soft), transparent 30rem),
        var(--page);
      font-family:
        Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.65;
      overflow-x: hidden;
    }

    button, a, summary { touch-action: manipulation; }
    button, a { font: inherit; }
    a { color: inherit; }
    button { color: inherit; }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .skip-link {
      position: fixed;
      z-index: 1000;
      top: 10px;
      left: 10px;
      min-height: 44px;
      padding: 10px 14px;
      color: #ffffff;
      background: #172033;
      border-radius: var(--radius-sm);
      transform: translateY(-160%);
    }

    .skip-link:focus { transform: translateY(0); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-header {
      position: sticky;
      z-index: 50;
      top: 0;
      display: grid;
      min-height: var(--header-height);
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 8px 18px;
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      border-bottom: 1px solid var(--line-soft);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      min-height: 44px;
      min-width: 0;
      align-items: center;
      text-decoration: none;
    }

    .eyebrow,
    .meta-label,
    .stage-number {
      margin: 0;
      color: var(--accent-strong);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .brand strong {
      display: block;
      overflow: hidden;
      margin-top: 1px;
      font-family: ui-serif, "Songti SC", "STSong", Georgia, serif;
      font-size: 19px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-action,
    .text-action {
      display: inline-flex;
      min-width: 44px;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 12px;
      color: var(--ink);
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition:
        color 180ms ease,
        border-color 180ms ease,
        background-color 180ms ease;
    }

    .icon-action:hover,
    .text-action:hover {
      color: var(--accent-strong);
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .icon-action svg,
    .text-action svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    #menu-button { display: none; }

    .app-shell {
      display: grid;
      min-height: calc(100dvh - var(--header-height));
      grid-template-columns: 316px minmax(0, 1fr);
    }

    .source-sidebar {
      position: sticky;
      top: var(--header-height);
      height: calc(100dvh - var(--header-height));
      overflow-y: auto;
      padding: 18px 14px 32px;
      background: color-mix(in srgb, var(--surface) 96%, transparent);
      border-right: 1px solid var(--line-soft);
      scrollbar-width: thin;
    }

    .nav-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-bottom: 14px;
      padding: 4px;
      background: var(--surface-soft);
      border-radius: 12px;
    }

    .nav-tab {
      min-height: 44px;
      padding: 7px 8px;
      background: transparent;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
    }

    .nav-tab[aria-selected="true"] {
      color: var(--accent-strong);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .nav-panel[hidden] { display: none; }

    .source-group {
      margin: 5px 0;
      border-left: 1px solid var(--line-soft);
    }

    .source-group summary {
      display: flex;
      min-height: 44px;
      align-items: center;
      gap: 8px;
      padding: 8px 8px 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      list-style: none;
    }

    .source-group summary::-webkit-details-marker { display: none; }

    .source-group summary::before {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      content: "";
      transform: rotate(-45deg);
      transition: transform 160ms ease;
    }

    .source-group[open] > summary::before { transform: rotate(45deg); }

    .source-group.current > summary {
      color: var(--amber);
      background: var(--amber-soft);
    }

    .source-group.mastered > summary { color: var(--accent-strong); }

    .source-title {
      min-width: 0;
      flex: 1;
      font-size: 14px;
      font-weight: 750;
    }

    .source-count {
      color: var(--quiet);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .source-children {
      padding: 2px 0 6px 16px;
    }

    .question-link,
    .spine-link {
      display: flex;
      min-height: 44px;
      align-items: flex-start;
      gap: 8px;
      margin: 2px 0;
      padding: 9px 10px;
      text-decoration: none;
      border-radius: 9px;
    }

    .question-link,
    .spine-link {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .question-link:hover,
    .spine-link:hover,
    .question-link[aria-current="page"],
    .spine-link[aria-current="page"] {
      color: var(--accent-strong);
      background: var(--accent-soft);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      margin-top: 5px;
      background: var(--surface);
      border: 2px solid var(--line);
      border-radius: 50%;
    }

    .mastered .status-dot,
    .status-dot.mastered {
      background: var(--accent);
      border-color: var(--accent);
    }

    .current .status-dot,
    .status-dot.current {
      background: var(--amber);
      border-color: var(--amber);
      box-shadow: 0 0 0 3px var(--amber-soft);
    }

    .spine-list {
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .spine-link strong {
      width: 24px;
      flex: 0 0 auto;
      color: var(--quiet);
      font-variant-numeric: tabular-nums;
    }

    .main {
      min-width: 0;
      padding: clamp(24px, 4vw, 56px) clamp(18px, 5vw, 72px) 80px;
    }

    .content {
      width: min(920px, 100%);
      margin: 0 auto;
      outline: none;
    }

    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .breadcrumb a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      padding: 4px 5px;
      color: var(--accent-strong);
      text-underline-offset: 3px;
    }

    .hero {
      padding: clamp(24px, 5vw, 52px);
      background: var(--surface);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
    }

    .question-hero {
      padding: clamp(22px, 3.5vw, 36px);
    }

    .question-hero h1 {
      margin-bottom: 14px;
      font-size: clamp(32px, 4.4vw, 54px);
    }

    h1,
    h2,
    h3 {
      font-family: ui-serif, "Songti SC", "STSong", Georgia, serif;
      letter-spacing: -0.025em;
    }

    h1 {
      max-width: 780px;
      margin: 8px 0 18px;
      font-size: clamp(34px, 5.5vw, 64px);
      font-weight: 650;
      line-height: 1.12;
    }

    h2 {
      margin: 0 0 14px;
      font-size: clamp(25px, 3.3vw, 36px);
      line-height: 1.2;
    }

    h3 { font-size: 20px; }

    .lead {
      max-width: 68ch;
      margin: 0;
      color: var(--muted);
      font-size: 17px;
    }

    .hero-meta,
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 22px;
    }

    .status-chip,
    .meta-chip {
      display: inline-flex;
      min-height: 32px;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      color: var(--muted);
      background: var(--surface-soft);
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 750;
    }

    .status-chip.current {
      color: var(--amber);
      background: var(--amber-soft);
      border-color: var(--amber);
    }

    .status-chip.mastered {
      color: var(--accent-strong);
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    a.meta-chip { min-height: 44px; }

    .section-block { margin-top: 46px; }

    .section-intro {
      max-width: 70ch;
      color: var(--muted);
    }

    .current-callout {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      margin-top: 24px;
      padding: 16px;
      color: inherit;
      text-decoration: none;
      background: var(--amber-soft);
      border: 1px solid var(--amber);
      border-radius: var(--radius-md);
      transition:
        border-color 180ms ease,
        background-color 180ms ease;
    }

    .current-callout:hover {
      background: color-mix(in srgb, var(--amber-soft) 78%, var(--surface));
      border-color: var(--focus);
    }

    .unit-list,
    .question-list {
      display: grid;
      gap: 12px;
      padding: 0;
      margin: 18px 0 0;
      list-style: none;
    }

    .unit-card,
    .question-card,
    .chain-card {
      display: block;
      padding: 18px 20px;
      color: inherit;
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      transition:
        border-color 180ms ease,
        background-color 180ms ease;
    }

    .unit-card:hover,
    .question-card:hover,
    .chain-card:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .unit-card-head,
    .question-card-head {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      justify-content: space-between;
    }

    .unit-card strong,
    .question-card strong,
    .chain-card strong {
      display: block;
      font-family: ui-serif, "Songti SC", "STSong", Georgia, serif;
      font-size: 19px;
      line-height: 1.35;
    }

    .unit-card p,
    .question-card p,
    .chain-card p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .progress-track {
      height: 7px;
      overflow: hidden;
      margin-top: 14px;
      background: var(--surface-soft);
      border: 1px solid var(--line-soft);
      border-radius: 999px;
    }

    .progress-track span {
      display: block;
      width: var(--value);
      height: 100%;
      background: var(--accent);
    }

    .source-note {
      margin-top: 22px;
      padding: 14px 16px;
      color: var(--muted);
      background: var(--surface-soft);
      border-left: 3px solid var(--line);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 14px;
    }

    .chain-context {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
      margin-top: 24px;
    }

    .chain-card .direction {
      display: block;
      margin-bottom: 5px;
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 800;
    }

    .proof-section {
      margin-top: 32px;
    }

    .question-context {
      margin-top: 52px;
      padding-top: 32px;
      border-top: 1px solid var(--line-soft);
    }

    .question-context .lead {
      margin-top: 8px;
    }

    .proof-tree {
      display: grid;
      justify-items: stretch;
      gap: 0;
    }

    .proof-branch {
      display: grid;
      justify-items: center;
      width: 100%;
    }

    .proposition {
      width: min(640px, 100%);
      overflow: hidden;
      color: var(--default-fg);
      background: var(--default-bg);
      border: 1px solid var(--default-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .proposition.conclusion {
      color: var(--conclusion-fg);
      background: var(--conclusion-bg);
      border-color: var(--conclusion-border);
      border-width: 2px;
    }

    .proposition.objection {
      color: var(--objection-fg);
      background: var(--objection-bg);
      border-color: var(--objection-border);
    }

    .proposition.boundary {
      color: var(--boundary-fg);
      background: var(--boundary-bg);
      border-color: var(--boundary-border);
    }

    .proposition summary {
      min-height: 64px;
      padding: 15px 18px;
      cursor: pointer;
      list-style: none;
    }

    .proposition summary::-webkit-details-marker { display: none; }

    .proposition summary::after {
      float: right;
      margin-left: 12px;
      color: currentColor;
      content: "＋";
      font-weight: 700;
    }

    .proposition[open] summary::after { content: "−"; }

    .node-label {
      display: block;
      margin-bottom: 5px;
      color: var(--default-muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .conclusion .node-label { color: var(--conclusion-muted); }
    .objection .node-label { color: var(--objection-muted); }
    .boundary .node-label { color: var(--boundary-muted); }

    .node-title {
      font-family: ui-serif, "Songti SC", "STSong", Georgia, serif;
      font-size: clamp(18px, 2.6vw, 23px);
      font-weight: 700;
      line-height: 1.4;
    }

    .node-detail {
      padding: 0 18px 18px;
      border-top: 1px solid currentColor;
    }

    .node-detail p {
      max-width: 68ch;
      margin: 14px 0 0;
    }

    .node-detail dl {
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr);
      gap: 8px 12px;
      margin: 16px 0 0;
      font-size: 14px;
    }

    .node-detail dt { font-weight: 800; }
    .node-detail dd { margin: 0; }

    .proof-arrow {
      display: grid;
      height: 48px;
      place-items: center;
      color: var(--accent-strong);
      font-size: 30px;
      font-weight: 500;
      line-height: 1;
    }

    .inference-card {
      width: min(720px, 100%);
      padding: 14px 16px;
      color: var(--junction-fg);
      background: var(--junction-bg);
      border: 1px solid var(--junction-border);
      border-radius: var(--radius-md);
    }

    .inference-card.objects {
      color: var(--junction-objection-fg);
      background: var(--junction-objection-bg);
      border-color: var(--junction-objection-border);
    }

    .inference-card.limits,
    .inference-card.responds {
      color: var(--junction-boundary-fg);
      background: var(--junction-boundary-bg);
      border-color: var(--junction-boundary-border);
    }

    .inference-card strong {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    .inference-card p { margin: 0; }

    .premise-row {
      display: grid;
      width: 100%;
      grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
      gap: 18px;
      align-items: start;
    }

    .premise-row .proposition { width: 100%; }

    .deeper-proof {
      width: 100%;
      margin-top: 12px;
      padding: 8px;
      background: color-mix(in srgb, var(--surface-soft) 70%, transparent);
      border: 1px dashed var(--line);
      border-radius: var(--radius-md);
    }

    .deeper-proof > summary {
      min-height: 44px;
      padding: 8px 10px;
      color: var(--accent-strong);
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
    }

    .deeper-proof[open] > summary { margin-bottom: 16px; }

    .empty-proof {
      padding: 24px;
      background: var(--surface);
      border: 1px dashed var(--line);
      border-radius: var(--radius-md);
      text-align: center;
    }

    .empty-proof strong {
      display: block;
      font-family: ui-serif, "Songti SC", "STSong", Georgia, serif;
      font-size: 23px;
    }

    .empty-proof p {
      max-width: 60ch;
      margin: 8px auto 0;
      color: var(--muted);
    }

    .sidebar-scrim {
      position: fixed;
      z-index: 59;
      inset: var(--header-height) 0 0;
      display: none;
      background: var(--scrim);
      border: 0;
    }

    .mobile-close {
      display: none;
      margin: 0 0 10px auto;
    }

    @media (max-width: 900px) {
      .app-header {
        grid-template-columns: auto minmax(0, 1fr) auto;
        padding: 8px 10px;
      }

      #menu-button { display: inline-flex; }
      .header-actions .text-action span { display: none; }
      .header-actions .text-action { padding: 8px; }

      .app-shell { display: block; }

      .source-sidebar {
        position: fixed;
        z-index: 60;
        top: var(--header-height);
        bottom: 0;
        left: 0;
        width: min(340px, calc(100vw - 44px));
        height: auto;
        transform: translateX(-104%);
        transition: transform 200ms ease-out;
        box-shadow: var(--shadow-md);
      }

      body.sidebar-open .source-sidebar { transform: translateX(0); }
      body.sidebar-open .sidebar-scrim { display: block; }
      .mobile-close { display: inline-flex; }

      .main {
        padding: 24px 16px 64px;
      }

      h1 { font-size: clamp(32px, 10vw, 48px); }
      .hero { padding: 24px 20px; }
    }

    @media (max-width: 620px) {
      .brand strong { font-size: 16px; }
      .header-actions { gap: 5px; }
      .header-actions .progress-action { display: none; }
      .chain-context { grid-template-columns: 1fr; }
      .node-detail dl { grid-template-columns: 1fr; }
      .node-detail dt { margin-top: 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *,
      *::before,
      *::after {
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body
  data-sml-version="7"
  data-course-id="{{COURSE_ID}}"
  data-revision="{{REVISION}}"
>
  <a class="skip-link" href="#main-content">跳到当前内容</a>

  <header class="app-header">
    <button
      id="menu-button"
      class="icon-action"
      type="button"
      aria-label="打开原书目录"
      aria-expanded="false"
      aria-controls="source-sidebar"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

    <a class="brand" href="#contents"><strong>{{COURSE_TITLE}}</strong></a>

    <div class="header-actions">
      <a id="current-link" class="text-action" href="#contents">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="7"></circle>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
        </svg>
        <span>回到当前</span>
      </a>
      <a class="text-action progress-action" href="{{PROGRESS_HREF}}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 19V9M12 19V5M19 19v-7"></path>
        </svg>
        <span>学习进度</span>
      </a>
      <button id="theme-button" class="icon-action" type="button" aria-label="切换明暗主题">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
      </button>
    </div>
  </header>

  <div class="app-shell">
    <aside id="source-sidebar" class="source-sidebar" aria-label="课程导航">
      <h2 id="source-nav-title" class="sr-only">课程导航</h2>
      <button id="mobile-close" class="icon-action mobile-close" type="button" aria-label="关闭目录">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18"></path>
        </svg>
      </button>

      <div class="nav-tabs" role="tablist" aria-label="导航方式">
        <button
          id="source-tab"
          class="nav-tab"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="source-panel"
        >原书结构</button>
        <button
          id="spine-tab"
          class="nav-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="spine-panel"
        >全书问题链</button>
      </div>

      <nav id="source-panel" class="nav-panel" role="tabpanel" aria-labelledby="source-tab"></nav>
      <nav id="spine-panel" class="nav-panel" role="tabpanel" aria-labelledby="spine-tab" hidden></nav>
    </aside>

    <button id="sidebar-scrim" class="sidebar-scrim" type="button" aria-label="关闭目录"></button>

    <main id="main-content" class="main" tabindex="-1">
      <div id="content" class="content"></div>
    </main>
  </div>

  <script type="application/json" id="graph-data">{{GRAPH_DATA}}</script>
  <script>
    "use strict";

    const snapshot = JSON.parse(
      document.getElementById("graph-data").textContent
    );
    const atlas = snapshot.argument_atlas;
    const spine = atlas.system_spine;
    const sourceStructure = atlas.source_structure;
    const workMode = sourceStructure.work_mode || "theory";
    const stages = [...spine.stages].sort(
      (first, second) => first.position - second.position
    );
    const maps = atlas.maps;
    const inferences = atlas.inferences;
    const nodes = snapshot.nodes;
    const transitions = spine.transitions;
    const units = [...sourceStructure.units].sort(
      (first, second) => first.position - second.position
    );

    const stageById = new Map(stages.map((stage) => [stage.id, stage]));
    const unitById = new Map(units.map((unit) => [unit.id, unit]));
    const mapById = new Map(maps.map((argumentMap) => [argumentMap.id, argumentMap]));
    const nodeById = new Map(nodes.map((node) => [node.id, node]));
    const transitionBySource = new Map(
      transitions.map((transition) => [transition.from_stage_id, transition])
    );
    const transitionByTarget = new Map(
      transitions.map((transition) => [transition.to_stage_id, transition])
    );
    const childrenByUnit = new Map();
    for (const unit of units) {
      const parentId = unit.parent_id || "";
      if (!childrenByUnit.has(parentId)) childrenByUnit.set(parentId, []);
      childrenByUnit.get(parentId).push(unit);
    }

    const statusLabels = {
      mastered: "已完成",
      current: "学习中",
      future: "尚未开始"
    };

    const kindLabels = {
      work: "全书",
      volume: "卷",
      part: "部分",
      division: "部",
      preface: "序言",
      introduction: "导言",
      chapter: "章",
      section: "节",
      essay: "篇",
      act: "幕",
      scene: "场",
      period: "时期",
      method: "方法单元"
    };

    const nodeTypeLabels = {
      claim: "命题",
      distinction: "区分",
      mechanism: "机制",
      example: "例证",
      boundary: "边界",
      objection: "反驳",
      question: "问题"
    };
    const nodeTypeLabelsByMode = {
      history: {
        claim: "历史判断",
        mechanism: "因果机制",
        example: "历史例证",
        objection: "竞争解释"
      },
      practical: {
        claim: "实践判断",
        mechanism: "作用机制",
        example: "实践案例",
        objection: "失败模式"
      },
      literature: {
        claim: "解释",
        mechanism: "形式作用",
        example: "文本例证",
        objection: "替代读法"
      },
      mixed: {
        claim: "判断",
        mechanism: "关系",
        objection: "质疑／替代"
      }
    };

    const modeCopyByMode = {
      theory: {
        target: "本问结论",
        ground: "根据",
        detail: "推理作用",
        supports: "因为这些根据，所以",
        objects: "反驳",
        limits: "限定",
        responds: "回应",
        repeated: "调用已出现的命题",
        deeper: "展开支撑这一命题的更深理由",
        pending: "局部论证待整理",
        building: "论证正在建立"
      },
      history: {
        target: "本问结果／解释",
        ground: "原因／证据",
        detail: "历史关系",
        supports: "这些原因或证据共同支持",
        objects: "竞争解释",
        limits: "证据边界",
        responds: "回应",
        repeated: "调用已出现的历史判断",
        deeper: "展开更深的原因、证据或竞争解释",
        pending: "局部历史关系待整理",
        building: "历史解释正在建立"
      },
      practical: {
        target: "本问目标／判断",
        ground: "方法／条件",
        detail: "实践作用",
        supports: "这些方法或条件共同支持",
        objects: "失败模式",
        limits: "适用边界",
        responds: "应对",
        repeated: "调用已出现的实践判断",
        deeper: "展开更深的方法、条件或失败模式",
        pending: "局部实践关系待整理",
        building: "实践判断正在建立"
      },
      literature: {
        target: "本问解释",
        ground: "文本依据",
        detail: "解释作用",
        supports: "这些文本依据共同支持",
        objects: "替代读法",
        limits: "解释边界",
        responds: "回应",
        repeated: "调用已出现的解释",
        deeper: "展开更深的文本依据或替代读法",
        pending: "局部解释关系待整理",
        building: "文本解释正在建立"
      },
      mixed: {
        target: "本问答案",
        ground: "根据",
        detail: "关系作用",
        supports: "这些根据共同支持",
        objects: "质疑／替代",
        limits: "边界",
        responds: "回应",
        repeated: "调用已出现的判断",
        deeper: "展开更深层关系",
        pending: "局部关系待整理",
        building: "局部关系正在建立"
      }
    };
    const modeCopy = modeCopyByMode[workMode] || modeCopyByMode.mixed;

    function nodeTypeLabel(node) {
      return nodeTypeLabelsByMode[workMode]?.[node.node_type] ||
        nodeTypeLabels[node.node_type] ||
        modeCopy.ground;
    }

    const content = document.getElementById("content");
    const main = document.getElementById("main-content");
    const sourcePanel = document.getElementById("source-panel");
    const spinePanel = document.getElementById("spine-panel");
    const sourceTab = document.getElementById("source-tab");
    const spineTab = document.getElementById("spine-tab");
    const menuButton = document.getElementById("menu-button");
    const currentLink = document.getElementById("current-link");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function routeHref(type, id = "") {
      return id
        ? `#${type}=${encodeURIComponent(id)}`
        : `#${type}`;
    }

    function currentStage() {
      const currentNode = nodeById.get(snapshot.current.node_id);
      return stages.find((stage) => {
        if (stage.answer_id === snapshot.current.node_id) return true;
        const argumentMap = mapById.get(stage.map_id);
        if (argumentMap?.node_ids?.includes(snapshot.current.node_id)) return true;
        return currentNode && stage.question === currentNode.title;
      }) || stages.find((stage) => stage.status === "current") || stages[0];
    }

    function stageForNode(nodeId) {
      const node = nodeById.get(nodeId);
      return stages.find((stage) => {
        if (stage.answer_id === nodeId) return true;
        const argumentMap = mapById.get(stage.map_id);
        if (argumentMap?.node_ids?.includes(nodeId)) return true;
        return node && stage.question === node.title;
      });
    }

    function unitAncestors(unitId) {
      const result = [];
      const seen = new Set();
      let cursor = unitById.get(unitId);
      while (cursor && !seen.has(cursor.id)) {
        seen.add(cursor.id);
        result.unshift(cursor);
        cursor = cursor.parent_id ? unitById.get(cursor.parent_id) : null;
      }
      return result;
    }

    function statusChip(status) {
      return `<span class="status-chip ${escapeHtml(status)}">
        <span class="status-dot ${escapeHtml(status)}" aria-hidden="true"></span>
        ${escapeHtml(statusLabels[status] || status)}
      </span>`;
    }

    function routeFromHash() {
      const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
      if (!raw || raw === "contents") return { type: "contents", id: "" };
      if (raw.startsWith("unit=")) {
        return { type: "unit", id: raw.slice(5) };
      }
      if (raw.startsWith("question=")) {
        return { type: "question", id: raw.slice(9) };
      }
      if (stageById.has(raw)) return { type: "question", id: raw };
      const stage = stageForNode(raw);
      if (stage) return { type: "question", id: stage.id };
      return { type: "contents", id: "" };
    }

    function isActiveUnit(unitId, route) {
      if (route.type === "unit") {
        return unitAncestors(route.id).some((unit) => unit.id === unitId);
      }
      if (route.type === "question") {
        const stage = stageById.get(route.id);
        return stage
          ? unitAncestors(stage.primary_unit_id).some((unit) => unit.id === unitId)
          : false;
      }
      return false;
    }

    function unitNavigation(unit, route) {
      const questions = stages.filter(
        (stage) => stage.primary_unit_id === unit.id
      );
      const children = childrenByUnit.get(unit.id) || [];
      const open = isActiveUnit(unit.id, route) || unit.status === "current";
      const questionMarkup = questions.map((stage) => `
        <a
          class="question-link ${escapeHtml(stage.status)}"
          href="${routeHref("question", stage.id)}"
          ${route.type === "question" && route.id === stage.id ? 'aria-current="page"' : ""}
        >
          <span class="status-dot ${escapeHtml(stage.status)}" aria-hidden="true"></span>
          <span>${escapeHtml(stage.question)}</span>
        </a>
      `).join("");
      const childMarkup = children.map((child) =>
        unitNavigation(child, route)
      ).join("");
      return `
        <details class="source-group ${escapeHtml(unit.status)}" ${open ? "open" : ""}>
          <summary>
            <span class="source-title">${escapeHtml(unit.title)}</span>
            <span class="source-count">${unit.completed || 0}/${unit.total || 0}</span>
          </summary>
          <div class="source-children">
            ${questionMarkup}
            ${childMarkup}
          </div>
        </details>
      `;
    }

    function renderSourceNavigation(route) {
      const roots = childrenByUnit.get("") || [];
      sourcePanel.innerHTML = roots.map((unit) =>
        unitNavigation(unit, route)
      ).join("");
      spinePanel.innerHTML = `
        <ol class="spine-list">
          ${stages.map((stage) => `
            <li>
              <a
                class="spine-link ${escapeHtml(stage.status)}"
                href="${routeHref("question", stage.id)}"
                ${route.type === "question" && route.id === stage.id ? 'aria-current="page"' : ""}
              >
                <strong>${String(stage.position).padStart(2, "0")}</strong>
                <span class="status-dot ${escapeHtml(stage.status)}" aria-hidden="true"></span>
                <span>${escapeHtml(stage.question)}</span>
              </a>
            </li>
          `).join("")}
        </ol>
      `;
    }

    function breadcrumb(items) {
      return `
        <nav class="breadcrumb" aria-label="当前位置">
          <a href="#contents">原书结构</a>
          ${items.map((item) => `
            <span aria-hidden="true">/</span>
            ${item.href
              ? `<a href="${item.href}">${escapeHtml(item.label)}</a>`
              : `<span>${escapeHtml(item.label)}</span>`}
          `).join("")}
        </nav>
      `;
    }

    function currentCallout() {
      const stage = currentStage();
      if (!stage) return "";
      return `
        <a
          class="current-callout"
          href="${routeHref("question", stage.id)}"
          aria-label="当前问题：${escapeHtml(stage.question)}"
        >
          <span class="status-dot current" aria-hidden="true"></span>
          <div>
            <strong>当前问题</strong>
            <div>${escapeHtml(stage.question)}</div>
          </div>
        </a>
      `;
    }

    function unitCard(unit) {
      const percent = unit.total
        ? Math.round((unit.completed || 0) * 100 / unit.total)
        : 0;
      return `
        <li>
          <a class="unit-card" href="${routeHref("unit", unit.id)}">
            <div class="unit-card-head">
              <div>
                <strong>${escapeHtml(unit.title)}</strong>
              </div>
              ${statusChip(unit.status)}
            </div>
            ${unit.summary ? `<p>${escapeHtml(unit.summary)}</p>` : ""}
            <div
              class="progress-track"
              role="progressbar"
              aria-label="${escapeHtml(unit.title)}完成进度"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="${percent}"
              style="--value:${percent}%"
            ><span></span></div>
          </a>
        </li>
      `;
    }

    function renderContentsPage() {
      const roots = childrenByUnit.get("") || [];
      content.innerHTML = `
        <section aria-labelledby="contents-title">
          <h1 id="contents-title">原书目录</h1>
          ${currentCallout()}
          <ol class="unit-list">${roots.map(unitCard).join("")}</ol>
        </section>
      `;
    }

    function questionCard(stage) {
      return `
        <li>
          <a class="question-card" href="${routeHref("question", stage.id)}">
            <div class="question-card-head">
              <div>
                <span class="stage-number">问题 ${stage.position}</span>
                <strong>${escapeHtml(stage.question)}</strong>
              </div>
              ${statusChip(stage.status)}
            </div>
            <p>${escapeHtml(stage.source)}</p>
          </a>
        </li>
      `;
    }

    function renderUnitPage(unitId) {
      const unit = unitById.get(unitId);
      if (!unit) return renderContentsPage();
      const ancestors = unitAncestors(unitId);
      const questions = stages.filter(
        (stage) => stage.primary_unit_id === unit.id
      );
      const children = childrenByUnit.get(unit.id) || [];
      const breadcrumbItems = ancestors.map((item, index) => ({
        label: item.title,
        href: index === ancestors.length - 1
          ? ""
          : routeHref("unit", item.id)
      }));
      content.innerHTML = `
        ${breadcrumb(breadcrumbItems)}
        <section class="hero">
          <h1>${escapeHtml(unit.title)}</h1>
          ${unit.summary ? `<p class="lead">${escapeHtml(unit.summary)}</p>` : ""}
          <div class="hero-meta">
            ${statusChip(unit.status)}
            <span class="meta-chip">${unit.completed || 0} / ${unit.total || 0} 个问题完成</span>
          </div>
          <p class="source-note">${escapeHtml(unit.source)}</p>
        </section>
        ${questions.length ? `
          <section class="section-block" aria-label="本单元问题">
            <ol class="question-list">${questions.map(questionCard).join("")}</ol>
          </section>
        ` : ""}
        ${children.length ? `
          <section class="section-block" aria-label="下级原书结构">
            <ol class="unit-list">${children.map(unitCard).join("")}</ol>
          </section>
        ` : ""}
        ${!questions.length && !children.length ? `
          <section class="section-block empty-proof">
            <strong>尚未编入问题</strong>
          </section>
        ` : ""}
      `;
    }

    function nodeClass(node, role) {
      if (role === "conclusion") return "conclusion";
      if (node.node_type === "objection") return "objection";
      if (node.node_type === "boundary") return "boundary";
      return "";
    }

    function propositionMarkup(nodeId, role) {
      const node = nodeById.get(nodeId);
      if (!node) return "";
      const classes = nodeClass(node, role);
      return `
        <details class="proposition ${classes}">
          <summary>
            <span class="node-label">
              ${escapeHtml(role === "conclusion" ? modeCopy.target : nodeTypeLabel(node))}
              · ${escapeHtml(statusLabels[node.status] || node.status)}
            </span>
            <span class="node-title">${escapeHtml(node.title)}</span>
          </summary>
          <div class="node-detail">
            <p>${escapeHtml(node.summary)}</p>
            <p>${escapeHtml(node.detail)}</p>
            <dl>
              <dt>原文依据</dt><dd>${escapeHtml(node.source)}</dd>
              <dt>${escapeHtml(modeCopy.detail)}</dt><dd>${escapeHtml(node.bridge)}</dd>
              <dt>掌握标准</dt><dd>${escapeHtml(node.mastery_criterion)}</dd>
            </dl>
          </div>
        </details>
      `;
    }

    function inferenceMarkup(inference) {
      return `
        <div class="inference-card ${escapeHtml(inference.kind)}">
          <strong>${escapeHtml(
            inference.kind === "objects"
              ? modeCopy.objects
              : inference.kind === "limits"
                ? modeCopy.limits
                : inference.kind === "responds"
                  ? modeCopy.responds
                  : modeCopy.supports
          )}</strong>
          <p>${escapeHtml(inference.bridge)}</p>
        </div>
      `;
    }

    function renderReasoning(nodeId, argumentMap, depth, path) {
      if (path.has(nodeId)) {
        return `<div class="empty-proof"><strong>${escapeHtml(modeCopy.repeated)}</strong>
          <p>${escapeHtml(nodeById.get(nodeId)?.title || nodeId)}</p></div>`;
      }
      const nextPath = new Set(path);
      nextPath.add(nodeId);
      const incoming = inferences.filter(
        (inference) =>
          inference.map_id === argumentMap.id &&
          inference.conclusion_id === nodeId
      );
      const role = nodeId === argumentMap.conclusion_id ? "conclusion" : "premise";
      const nodeMarkup = propositionMarkup(nodeId, role);
      if (!incoming.length) {
        return `<div class="proof-branch">${nodeMarkup}</div>`;
      }
      const reasoning = incoming.map((inference) => `
        <div class="proof-arrow" aria-hidden="true">↑</div>
        ${inferenceMarkup(inference)}
        <div class="proof-arrow" aria-hidden="true">↑</div>
        <div class="premise-row">
          ${inference.premise_ids.map((premiseId) =>
            renderReasoning(premiseId, argumentMap, depth + 1, nextPath)
          ).join("")}
        </div>
      `).join("");
      if (depth >= 1) {
        return `
          <div class="proof-branch">
            ${nodeMarkup}
            <details class="deeper-proof">
              <summary>${escapeHtml(modeCopy.deeper)}</summary>
              ${reasoning}
            </details>
          </div>
        `;
      }
      return `<div class="proof-branch">${nodeMarkup}${reasoning}</div>`;
    }

    function renderProofFor(stage) {
      const argumentMap = mapById.get(stage.map_id);
      if (
        !argumentMap ||
        argumentMap.status === "future" ||
        !argumentMap.conclusion_id ||
        !argumentMap.node_ids?.length
      ) {
        const completedWithoutProof = stage.status === "mastered";
        return `
          <div class="empty-proof">
            <strong>${completedWithoutProof
              ? modeCopy.pending
              : stage.status === "current"
                ? modeCopy.building
                : "尚未展开"}</strong>
          </div>
        `;
      }
      return `
        <div class="proof-tree">
          ${renderReasoning(argumentMap.conclusion_id, argumentMap, 0, new Set())}
        </div>
      `;
    }

    function relatedUnitChips(stage) {
      const ids = [stage.primary_unit_id, ...(stage.related_unit_ids || [])];
      return ids.map((unitId, index) => {
        const unit = unitById.get(unitId);
        if (!unit) return "";
        return `<a class="meta-chip" href="${routeHref("unit", unit.id)}">
          ${index === 0 ? "主要章节" : "相关章节"} · ${escapeHtml(unit.title)}
        </a>`;
      }).join("");
    }

    function chainContext(stage) {
      const previousTransition = transitionByTarget.get(stage.id);
      const nextTransition = transitionBySource.get(stage.id);
      const previousStage = previousTransition
        ? stageById.get(previousTransition.from_stage_id)
        : null;
      const nextStage = nextTransition
        ? stageById.get(nextTransition.to_stage_id)
        : null;
      return `
        <section class="chain-context" aria-label="问题链前后关系">
          ${previousStage ? `
            <a class="chain-card" href="${routeHref("question", previousStage.id)}">
              <span class="direction">上一问</span>
              <strong>${escapeHtml(previousStage.question)}</strong>
              <p>${escapeHtml(previousTransition.bridge)}</p>
            </a>
          ` : ""}
          ${nextStage ? `
            <a class="chain-card" href="${routeHref("question", nextStage.id)}">
              <span class="direction">下一问</span>
              <strong>${escapeHtml(nextStage.question)}</strong>
              <p>${escapeHtml(nextTransition.bridge)}</p>
            </a>
          ` : ""}
        </section>
      `;
    }

    function renderQuestionPage(stageId) {
      const stage = stageById.get(stageId);
      if (!stage) return renderContentsPage();
      const primaryUnit = unitById.get(stage.primary_unit_id);
      const ancestorItems = primaryUnit
        ? unitAncestors(primaryUnit.id).map((unit) => ({
            label: unit.title,
            href: routeHref("unit", unit.id)
          }))
        : [];
      ancestorItems.push({ label: `问题 ${stage.position}`, href: "" });
      content.innerHTML = `
        ${breadcrumb(ancestorItems)}
        <article>
          <header class="hero question-hero">
            <p class="eyebrow">问题 ${stage.position} / ${stages.length}</p>
            <h1>${escapeHtml(stage.question)}</h1>
            <div class="hero-meta">
              ${statusChip(stage.status)}
              ${relatedUnitChips(stage)}
            </div>
          </header>

          <section class="proof-section" aria-label="局部关系">
            ${renderProofFor(stage)}
          </section>

          <section class="question-context" aria-labelledby="question-context-title">
            <h2 id="question-context-title">原书位置</h2>
            <p class="lead">${escapeHtml(
              mapById.get(stage.map_id)?.summary ||
              "本问题的答案将在学习过程中逐步建立。"
            )}</p>
            <p class="source-note">${escapeHtml(stage.source)}</p>
          </section>

          ${chainContext(stage)}
        </article>
      `;
    }

    function closeSidebar() {
      document.body.classList.remove("sidebar-open");
      menuButton.setAttribute("aria-expanded", "false");
    }

    function renderRoute() {
      const route = routeFromHash();
      renderSourceNavigation(route);
      if (route.type === "unit") renderUnitPage(route.id);
      else if (route.type === "question") renderQuestionPage(route.id);
      else renderContentsPage();
      closeSidebar();
      window.scrollTo({ top: 0, behavior: "auto" });
      main.focus({ preventScroll: true });
    }

    function setNavigationTab(tab) {
      const sourceActive = tab === "source";
      sourceTab.setAttribute("aria-selected", String(sourceActive));
      spineTab.setAttribute("aria-selected", String(!sourceActive));
      sourcePanel.hidden = !sourceActive;
      spinePanel.hidden = sourceActive;
      document.getElementById("source-nav-title").textContent =
        sourceActive ? sourceStructure.label : "全书问题链";
    }

    sourceTab.addEventListener("click", () => setNavigationTab("source"));
    spineTab.addEventListener("click", () => setNavigationTab("spine"));
    menuButton.addEventListener("click", () => {
      const open = !document.body.classList.contains("sidebar-open");
      document.body.classList.toggle("sidebar-open", open);
      menuButton.setAttribute("aria-expanded", String(open));
    });
    document.getElementById("mobile-close").addEventListener("click", closeSidebar);
    document.getElementById("sidebar-scrim").addEventListener("click", closeSidebar);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeSidebar();
    });
    document.getElementById("theme-button").addEventListener("click", () => {
      const dark = document.body.dataset.theme === "dark" ||
        (!document.body.dataset.theme &&
          matchMedia("(prefers-color-scheme: dark)").matches);
      document.body.dataset.theme = dark ? "light" : "dark";
    });
    window.addEventListener("hashchange", renderRoute);

    const activeStage = currentStage();
    if (activeStage) {
      currentLink.href = routeHref("question", activeStage.id);
    }
    renderRoute();
  </script>
</body>
</html>
