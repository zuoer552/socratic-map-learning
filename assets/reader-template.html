<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Cpath d='M18 16h30v34H21c-4 0-7-3-7-7V20c0-2 2-4 4-4Z' fill='none' stroke='white' stroke-width='4'/%3E%3C/svg%3E">
  <title>Book Grilling · 学习地图</title>
  <style>
    :root {
      --paper: #f7f4ec;
      --paper-deep: #eee9dc;
      --surface: #fffdf8;
      --surface-raised: #ffffff;
      --ink: #17211f;
      --ink-soft: #44524f;
      --muted: #6a7774;
      --line: #d8d5cb;
      --line-strong: #b8beb9;
      --teal: #0f766e;
      --teal-strong: #0b5e58;
      --teal-soft: #d9efea;
      --teal-ink: #093f3b;
      --amber: #b65f0b;
      --amber-soft: #f8e7c7;
      --amber-ink: #6b3707;
      --danger: #b42318;
      --danger-soft: #fee4e2;
      --focus: #0b6fdd;
      --shadow-sm: 0 1px 2px rgb(23 33 31 / 0.06);
      --shadow-md: 0 12px 32px rgb(23 33 31 / 0.09);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --sans: "Atkinson Hyperlegible", "SF Pro Text", "PingFang SC",
        "Microsoft YaHei", system-ui, sans-serif;
      --serif: "Iowan Old Style", "Source Han Serif SC", "Noto Serif CJK SC",
        "Songti SC", STSong, Georgia, serif;
      --content: 860px;
      --sidebar: 320px;
      --topbar: 72px;
      --ease: 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #111715;
        --paper-deep: #18201d;
        --surface: #1b2421;
        --surface-raised: #202b27;
        --ink: #f2f5f2;
        --ink-soft: #c7d0cc;
        --muted: #a8b3ae;
        --line: #35413c;
        --line-strong: #53615b;
        --teal: #5ed0c2;
        --teal-strong: #8bdfd5;
        --teal-soft: #173e39;
        --teal-ink: #c9f7f0;
        --amber: #f0ae59;
        --amber-soft: #4b351d;
        --amber-ink: #ffe7c2;
        --danger: #ff8a80;
        --danger-soft: #4b2421;
        --focus: #83b9ff;
        --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.25);
        --shadow-md: 0 18px 42px rgb(0 0 0 / 0.28);
      }
    }

    :root[data-theme="dark"] {
      --paper: #111715;
      --paper-deep: #18201d;
      --surface: #1b2421;
      --surface-raised: #202b27;
      --ink: #f2f5f2;
      --ink-soft: #c7d0cc;
      --muted: #a8b3ae;
      --line: #35413c;
      --line-strong: #53615b;
      --teal: #5ed0c2;
      --teal-strong: #8bdfd5;
      --teal-soft: #173e39;
      --teal-ink: #c9f7f0;
      --amber: #f0ae59;
      --amber-soft: #4b351d;
      --amber-ink: #ffe7c2;
      --danger: #ff8a80;
      --danger-soft: #4b2421;
      --focus: #83b9ff;
      --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.25);
      --shadow-md: 0 18px 42px rgb(0 0 0 / 0.28);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--paper);
      scroll-behavior: smooth;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 82% -10%, rgb(15 118 110 / 0.08), transparent 30rem),
        var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    button,
    summary,
    a {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    button {
      color: inherit;
      font: inherit;
    }

    a {
      color: var(--teal-strong);
      text-underline-offset: 0.2em;
    }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
      border-radius: 6px;
    }

    .skip-link {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 1000;
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--ink);
      color: var(--paper);
      transform: translateY(-160%);
      transition: transform var(--ease);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      min-height: var(--topbar);
      align-items: center;
      gap: 12px;
      padding: 0 24px;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 78%, transparent);
      background: color-mix(in srgb, var(--paper) 91%, transparent);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      min-height: 44px;
      min-width: 0;
      align-items: center;
      gap: 12px;
      color: inherit;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: var(--surface);
      color: var(--teal-strong);
      box-shadow: var(--shadow-sm);
    }

    .brand-copy {
      display: grid;
      min-width: 0;
      line-height: 1.2;
    }

    .brand-copy strong {
      overflow: hidden;
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand-copy span {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .icon-button {
      display: inline-grid;
      width: 44px;
      height: 44px;
      cursor: pointer;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      transition:
        background-color var(--ease),
        border-color var(--ease),
        color var(--ease);
    }

    .icon-button:hover {
      border-color: var(--line-strong);
      background: var(--surface-raised);
      color: var(--teal-strong);
    }

    .icon-button:active {
      background: var(--paper-deep);
    }

    .menu-button {
      display: none;
    }

    .shell {
      display: grid;
      min-height: calc(100dvh - var(--topbar));
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: var(--topbar);
      height: calc(100dvh - var(--topbar));
      overflow: auto;
      border-right: 1px solid var(--line);
      background: color-mix(in srgb, var(--paper-deep) 68%, var(--paper));
      scrollbar-color: var(--line-strong) transparent;
    }

    .sidebar-inner {
      display: grid;
      gap: 24px;
      padding: 28px 20px 40px;
    }

    .progress-card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .progress-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .progress-heading span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .progress-heading strong {
      font-variant-numeric: tabular-nums;
      font-size: 14px;
    }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--paper-deep);
    }

    .progress-fill {
      width: var(--progress, 0%);
      height: 100%;
      border-radius: inherit;
      background: var(--teal);
      transition: width 280ms ease-out;
    }

    .progress-caption {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .toc-label {
      margin: 0 8px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .toc,
    .toc ul {
      display: grid;
      gap: 4px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .toc ul {
      margin: 4px 0 4px 18px;
      padding-left: 11px;
      border-left: 1px solid var(--line);
    }

    .toc-group {
      padding: 8px 10px 4px;
      color: var(--ink-soft);
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 650;
    }

    .toc-link,
    .toc-future {
      display: grid;
      min-height: 44px;
      width: 100%;
      grid-template-columns: 24px minmax(0, 1fr);
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      text-align: left;
    }

    .toc-link {
      cursor: pointer;
      transition:
        background-color var(--ease),
        color var(--ease);
    }

    .toc-link:hover {
      background: color-mix(in srgb, var(--teal-soft) 52%, transparent);
      color: var(--teal-strong);
    }

    .toc-link[aria-current="page"] {
      background: var(--teal-soft);
      color: var(--teal-ink);
      font-weight: 700;
    }

    .toc-future {
      color: var(--muted);
    }

    .toc-title {
      overflow-wrap: anywhere;
      line-height: 1.35;
    }

    .toc-status {
      display: inline-grid;
      width: 20px;
      height: 20px;
      place-items: center;
      color: var(--muted);
    }

    .toc-link[data-status="completed"] .toc-status {
      color: var(--teal);
    }

    .toc-link[data-status="current"] .toc-status,
    .toc-link[data-status="needs_preparation"] .toc-status,
    .toc-link[data-status="invalid"] .toc-status {
      color: var(--amber);
    }

    .main {
      width: 100%;
      min-width: 0;
      padding: 48px clamp(20px, 5vw, 72px) 96px;
    }

    .content {
      width: min(100%, var(--content));
      margin: 0 auto;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 16px;
      color: var(--teal-strong);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 22px;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
      content: "";
    }

    h1,
    h2,
    h3 {
      margin: 0;
      font-family: var(--serif);
      text-wrap: balance;
    }

    h1 {
      max-width: 18ch;
      font-size: clamp(38px, 6vw, 72px);
      font-weight: 650;
      letter-spacing: -0.035em;
      line-height: 1.02;
    }

    h2 {
      font-size: clamp(27px, 3vw, 38px);
      font-weight: 650;
      letter-spacing: -0.025em;
      line-height: 1.15;
    }

    h3 {
      font-size: 21px;
      line-height: 1.3;
    }

    .lede {
      max-width: 64ch;
      margin: 24px 0 0;
      color: var(--ink-soft);
      font-family: var(--serif);
      font-size: clamp(18px, 2vw, 22px);
      line-height: 1.65;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin: 26px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .section {
      margin-top: 56px;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 20px;
    }

    .section-heading p {
      max-width: 48ch;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .hero-grid {
      display: grid;
      gap: 28px;
      grid-template-columns: minmax(0, 1fr) minmax(240px, 0.42fr);
      align-items: end;
    }

    .stat-panel {
      display: grid;
      gap: 1px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--line);
      box-shadow: var(--shadow-sm);
    }

    .stat {
      padding: 20px;
      background: var(--surface);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .stat strong {
      display: block;
      margin-top: 4px;
      font-family: var(--serif);
      font-size: 28px;
      font-variant-numeric: tabular-nums;
    }

    .callout {
      position: relative;
      display: grid;
      gap: 14px;
      padding: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .callout::after {
      position: absolute;
      top: -40px;
      right: -40px;
      width: 140px;
      height: 140px;
      border: 28px solid color-mix(in srgb, var(--teal) 12%, transparent);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .callout-label {
      display: inline-flex;
      width: fit-content;
      min-height: 28px;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--amber-soft);
      color: var(--amber-ink);
      font-size: 12px;
      font-weight: 750;
    }

    .callout h3 {
      max-width: 26ch;
    }

    .callout p {
      max-width: 58ch;
      margin: 0;
      color: var(--ink-soft);
    }

    .text-button {
      display: inline-flex;
      min-height: 44px;
      width: fit-content;
      cursor: pointer;
      align-items: center;
      gap: 8px;
      padding: 0 15px;
      border: 1px solid var(--teal);
      border-radius: 10px;
      background: var(--teal);
      color: #ffffff;
      font-weight: 750;
      text-decoration: none;
      transition:
        background-color var(--ease),
        border-color var(--ease);
    }

    .text-button:hover {
      border-color: var(--teal-strong);
      background: var(--teal-strong);
    }

    .unit-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .unit-card {
      display: grid;
      min-height: 150px;
      cursor: pointer;
      gap: 18px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: inherit;
      text-align: left;
      box-shadow: var(--shadow-sm);
      transition:
        border-color var(--ease),
        box-shadow var(--ease),
        background-color var(--ease);
    }

    .unit-card:hover {
      border-color: var(--line-strong);
      background: var(--surface-raised);
      box-shadow: var(--shadow-md);
    }

    .unit-card:disabled {
      cursor: default;
      box-shadow: none;
      opacity: 0.72;
    }

    .unit-card:disabled:hover {
      border-color: var(--line);
      background: var(--surface);
    }

    .unit-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .unit-number {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      font-weight: 750;
      letter-spacing: 0.08em;
    }

    .unit-card h3 {
      font-size: 19px;
    }

    .unit-card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .badge {
      display: inline-flex;
      min-height: 28px;
      width: fit-content;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .badge[data-tone="complete"] {
      border-color: color-mix(in srgb, var(--teal) 24%, transparent);
      background: var(--teal-soft);
      color: var(--teal-ink);
    }

    .badge[data-tone="current"] {
      border-color: color-mix(in srgb, var(--amber) 30%, transparent);
      background: var(--amber-soft);
      color: var(--amber-ink);
    }

    .badge[data-tone="locked"] {
      border-color: var(--line);
      background: var(--paper-deep);
      color: var(--muted);
    }

    .badge[data-tone="danger"] {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 13px;
    }

    .breadcrumb button {
      min-width: 44px;
      min-height: 44px;
      cursor: pointer;
      border: 0;
      background: transparent;
      color: var(--teal-strong);
      padding: 2px 4px;
    }

    .unit-header {
      display: grid;
      gap: 18px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--line);
    }

    .unit-title-row {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 24px;
    }

    .unit-header h1 {
      max-width: 22ch;
      font-size: clamp(34px, 5vw, 58px);
    }

    .unit-locator {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .unit-progress {
      display: grid;
      max-width: 420px;
      gap: 9px;
      margin-top: 8px;
    }

    .unit-progress-copy {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
    }

    .tree-intro {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 48px 0 24px;
    }

    .tree-intro p {
      max-width: 48ch;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .knowledge-tree,
    .knowledge-tree ol {
      position: relative;
      display: grid;
      gap: 18px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .knowledge-tree ol {
      margin-top: 18px;
      margin-left: 26px;
      padding-left: 26px;
    }

    .knowledge-tree ol::before {
      position: absolute;
      top: -18px;
      bottom: 26px;
      left: 0;
      width: 1px;
      background: var(--line-strong);
      content: "";
    }

    .tree-node {
      position: relative;
    }

    .knowledge-tree ol > .tree-node::before {
      position: absolute;
      top: 30px;
      left: -26px;
      width: 26px;
      height: 1px;
      background: var(--line-strong);
      content: "";
    }

    .node-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .node-card[data-status="resolved"] {
      border-color: color-mix(in srgb, var(--teal) 38%, var(--line));
    }

    .node-card[data-status="current"] {
      border-color: var(--amber);
      box-shadow:
        0 0 0 3px color-mix(in srgb, var(--amber) 12%, transparent),
        var(--shadow-md);
    }

    .node-card[data-status="locked"] {
      border-style: dashed;
      background:
        repeating-linear-gradient(
          -45deg,
          transparent,
          transparent 12px,
          color-mix(in srgb, var(--line) 24%, transparent) 12px,
          color-mix(in srgb, var(--line) 24%, transparent) 13px
        ),
        var(--surface);
    }

    .node-summary {
      display: grid;
      min-height: 64px;
      cursor: pointer;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      list-style: none;
    }

    .node-summary::-webkit-details-marker {
      display: none;
    }

    .node-summary:hover {
      background: color-mix(in srgb, var(--paper-deep) 46%, transparent);
    }

    .node-index {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      font-weight: 750;
    }

    .node-card[data-status="resolved"] .node-index {
      border-color: transparent;
      background: var(--teal-soft);
      color: var(--teal-ink);
    }

    .node-card[data-status="current"] .node-index {
      border-color: transparent;
      background: var(--amber-soft);
      color: var(--amber-ink);
    }

    .node-question {
      font-family: var(--serif);
      font-size: clamp(17px, 2vw, 20px);
      font-weight: 650;
      line-height: 1.42;
    }

    .chevron {
      color: var(--muted);
      transition: transform var(--ease);
    }

    details[open] > .node-summary .chevron {
      transform: rotate(180deg);
    }

    .node-body {
      display: grid;
      gap: 24px;
      padding: 4px 24px 26px 64px;
    }

    .answer-label,
    .source-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .answer {
      max-width: 68ch;
      margin: 0;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 18px;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .source-box {
      padding: 18px 20px;
      border-left: 3px solid var(--teal);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      background: var(--paper-deep);
    }

    .source-box blockquote {
      margin: 0;
      color: var(--ink-soft);
      font-family: var(--serif);
      font-size: 16px;
      line-height: 1.75;
    }

    .source-locator {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .interpretive-note,
    .learner-note,
    .open-question {
      display: flex;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: var(--paper-deep);
      color: var(--ink-soft);
      font-size: 14px;
    }

    .open-question {
      background: var(--amber-soft);
      color: var(--amber-ink);
    }

    .locked-body {
      display: grid;
      min-height: 64px;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      color: var(--muted);
    }

    .locked-body .node-question {
      color: var(--ink-soft);
    }

    .empty-state {
      display: grid;
      min-height: 300px;
      place-items: center;
      padding: 48px 24px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-lg);
      background: var(--surface);
      text-align: center;
    }

    .empty-state-inner {
      display: grid;
      max-width: 460px;
      justify-items: center;
      gap: 14px;
    }

    .empty-icon {
      display: grid;
      width: 56px;
      height: 56px;
      place-items: center;
      border-radius: 16px;
      background: var(--amber-soft);
      color: var(--amber-ink);
    }

    .empty-state p {
      margin: 0;
      color: var(--muted);
    }

    .synthesis {
      display: grid;
      gap: 26px;
      padding: clamp(24px, 5vw, 44px);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background:
        linear-gradient(145deg, color-mix(in srgb, var(--teal-soft) 50%, transparent), transparent 48%),
        var(--surface);
      box-shadow: var(--shadow-md);
    }

    .synthesis-answer {
      max-width: 68ch;
      margin: 0;
      font-family: var(--serif);
      font-size: 19px;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .contribution-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .contribution-button {
      display: grid;
      width: 100%;
      min-height: 52px;
      cursor: pointer;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: inherit;
      text-align: left;
    }

    .contribution-button:hover {
      border-color: var(--teal);
    }

    .scrim {
      position: fixed;
      inset: var(--topbar) 0 0;
      z-index: 25;
      display: none;
      border: 0;
      background: rgb(0 0 0 / 0.52);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    svg {
      display: block;
    }

    @media (max-width: 980px) {
      .menu-button {
        display: inline-grid;
      }

      .shell {
        display: block;
      }

      .sidebar {
        position: fixed;
        inset: var(--topbar) auto 0 0;
        z-index: 30;
        width: min(88vw, var(--sidebar));
        height: auto;
        transform: translateX(-105%);
        box-shadow: var(--shadow-md);
        transition: transform 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      body[data-menu-open="true"] .sidebar {
        transform: translateX(0);
      }

      body[data-menu-open="true"] .scrim {
        display: block;
      }

      .main {
        padding-top: 36px;
      }

      .hero-grid {
        grid-template-columns: 1fr;
        align-items: stretch;
      }

      .stat-panel {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      :root {
        --topbar: 64px;
      }

      .topbar {
        padding: 0 12px;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
      }

      .brand-copy span {
        display: none;
      }

      .main {
        padding: 28px 16px 72px;
      }

      h1 {
        font-size: clamp(34px, 12vw, 48px);
      }

      .unit-grid {
        grid-template-columns: 1fr;
      }

      .section {
        margin-top: 44px;
      }

      .section-heading,
      .tree-intro,
      .unit-title-row {
        align-items: start;
        flex-direction: column;
      }

      .unit-title-row {
        display: grid;
      }

      .knowledge-tree ol {
        margin-left: 11px;
        padding-left: 20px;
      }

      .knowledge-tree ol > .tree-node::before {
        left: -20px;
        width: 20px;
      }

      .node-summary,
      .locked-body {
        grid-template-columns: 32px minmax(0, 1fr) auto;
        gap: 10px;
        padding: 13px 12px;
      }

      .node-index {
        width: 30px;
        height: 30px;
      }

      .node-body {
        padding: 4px 16px 22px;
      }

      .answer {
        font-size: 17px;
      }

      .stat-panel {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    @media print {
      .topbar,
      .sidebar,
      .scrim,
      .text-button {
        display: none !important;
      }

      .shell {
        display: block;
      }

      .main {
        padding: 0;
      }

      .content {
        width: 100%;
      }

      .node-card,
      .callout,
      .synthesis {
        break-inside: avoid;
        box-shadow: none;
      }

      details:not([open]) > *:not(summary) {
        display: block;
      }
    }
  </style>
</head>
<body data-menu-open="false">
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <header class="topbar">
    <button
      class="icon-button menu-button"
      id="menu-toggle"
      type="button"
      aria-label="打开学习目录"
      aria-controls="sidebar"
      aria-expanded="false"
    ></button>
    <a class="brand" href="#overview" data-nav="overview">
      <span class="brand-mark" id="brand-icon" aria-hidden="true"></span>
      <span class="brand-copy">
        <strong id="brand-title">Book Grilling</strong>
        <span>Question by question</span>
      </span>
    </a>
    <div class="topbar-actions">
      <button
        class="icon-button"
        id="theme-toggle"
        type="button"
        aria-label="切换明暗主题"
      ></button>
    </div>
  </header>

  <div class="shell">
    <aside
      class="sidebar"
      id="sidebar"
      aria-label="全书学习目录"
      tabindex="-1"
    >
      <div class="sidebar-inner">
        <section class="progress-card" aria-labelledby="progress-title">
          <div class="progress-heading">
            <span id="progress-title">学习单元</span>
            <strong id="progress-value">0 / 0</strong>
          </div>
          <div
            class="progress-track"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            id="progress-track"
          >
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <p class="progress-caption" id="progress-caption">正在载入学习状态</p>
        </section>
        <nav aria-labelledby="toc-title">
          <p class="toc-label" id="toc-title">原书目录</p>
          <div id="toc-root"></div>
        </nav>
      </div>
    </aside>

    <main class="main" id="main-content" tabindex="-1">
      <div class="content" id="view"></div>
    </main>
  </div>

  <button class="scrim" id="scrim" type="button" aria-label="关闭学习目录"></button>
  <div class="sr-only" id="live-region" aria-live="polite"></div>

  <script id="course-data" type="application/json">__BOOK_GRILLING_DATA__</script>
  <script>
    (() => {
      "use strict";

      const state = JSON.parse(document.getElementById("course-data").textContent);
      const root = document.documentElement;
      const body = document.body;
      const view = document.getElementById("view");
      const sidebar = document.getElementById("sidebar");
      const menuToggle = document.getElementById("menu-toggle");
      const themeToggle = document.getElementById("theme-toggle");
      const scrim = document.getElementById("scrim");
      const liveRegion = document.getElementById("live-region");
      const mobileMenu = matchMedia("(max-width: 980px)");
      const unitById = Object.fromEntries(
        state.source_units.map((unit) => [unit.id, unit])
      );
      const children = {};
      for (const unit of state.source_units) {
        const parent = unit.parent_id || "";
        (children[parent] ||= []).push(unit);
      }
      for (const items of Object.values(children)) {
        items.sort((a, b) => a.position - b.position);
      }

      const icons = {
        book: `<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.2A2.8 2.8 0 0 1 6.8 16.4H20"/><path d="M6.8 3.5H20v16H6.8A2.8 2.8 0 0 1 4 16.7V6.3a2.8 2.8 0 0 1 2.8-2.8Z"/></svg>`,
        menu: `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>`,
        sun: `<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>`,
        moon: `<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 15.3A8.5 8.5 0 0 1 8.7 3.5 8.5 8.5 0 1 0 20.5 15.3Z"/></svg>`,
        check: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>`,
        lock: `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>`,
        current: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>`,
        chevron: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5"/></svg>`,
        arrow: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M14 7l5 5-5 5"/></svg>`,
        map: `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="11" cy="18" r="2"/><path d="m7.8 6.8 8.3.8M7 7.8l3.1 8.4M16.9 9.7l-4.7 6.7"/></svg>`,
        source: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 3v15H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>`,
        verified: `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 2.2 2.1 3-.3.8 2.9 2.6 1.5-1.2 2.8 1.2 2.8-2.6 1.5-.8 2.9-3-.3L12 20l-2.2-2.1-3 .3-.8-2.9-2.6-1.5L4.6 11 3.4 8.2 6 6.7l.8-2.9 3 .3Z"/><path d="m8.8 11.2 2 2 4.5-4.5"/></svg>`,
        warning: `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.7 2.5 18a2 2 0 0 0 1.8 3h15.4a2 2 0 0 0 1.8-3L13.7 3.7a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>`,
        quote: `<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7.4 6C4.4 8.1 3 10.6 3 13.6 3 16.3 4.5 18 6.8 18c2 0 3.4-1.4 3.4-3.3 0-1.8-1.2-3.1-2.9-3.1-.4 0-.8.1-1.1.2.4-1.6 1.4-3 3-4.2L7.4 6Zm9 0c-3 2.1-4.4 4.6-4.4 7.6 0 2.7 1.5 4.4 3.8 4.4 2 0 3.4-1.4 3.4-3.3 0-1.8-1.2-3.1-2.9-3.1-.4 0-.8.1-1.1.2.4-1.6 1.4-3 3-4.2L16.4 6Z"/></svg>`
      };

      const escapeHtml = (value) =>
        String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");

      const provenanceLabels = {
        source_explicit: "作者明确表达",
        editorial_synthesis: "依据原文整理",
        external_context: "外部背景",
        contested_interpretation: "争议解释"
      };

      const statusMeta = (status) => {
        if (status === "completed") return ["已完成", "complete", icons.check];
        if (status === "current") return ["正在学习", "current", icons.current];
        if (status === "needs_preparation") return ["待初始化", "current", icons.current];
        if (status === "invalid") return ["待修正", "danger", icons.warning];
        return ["尚未学习", "locked", icons.lock];
      };

      const learningUnits = state.learning_unit_ids.map((id) => unitById[id]);
      const isPartial = state.source.coverage_scope === "partial";
      const completedCount = state.learning_unit_ids.filter(
        (id) => state.unit_records[id]?.status === "completed"
      ).length;
      const percent = learningUnits.length
        ? Math.round((completedCount / learningUnits.length) * 100)
        : 0;

      document.title = `${state.book.title} · Book Grilling`;
      document.getElementById("brand-title").textContent = state.book.title;
      document.getElementById("brand-icon").innerHTML = icons.book;
      menuToggle.innerHTML = icons.menu;
      document.getElementById("progress-value").textContent =
        `${completedCount} / ${learningUnits.length}`;
      document.getElementById("progress-caption").textContent =
        state.book_status === "completed"
          ? (isPartial ? "当前可用部分已经系统讲完" : "全书已经系统讲完")
          : `已完成 ${percent}% 的学习单元`;
      const progressTrack = document.getElementById("progress-track");
      progressTrack.setAttribute("aria-valuenow", String(percent));
      document.getElementById("progress-fill").style.setProperty(
        "--progress",
        `${percent}%`
      );

      const savedTheme = (() => {
        try {
          return localStorage.getItem("book-grilling-theme");
        } catch {
          return null;
        }
      })();
      if (savedTheme === "light" || savedTheme === "dark") {
        root.dataset.theme = savedTheme;
      }

      const effectiveTheme = () => {
        if (root.dataset.theme) return root.dataset.theme;
        return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      };

      const updateThemeButton = () => {
        const dark = effectiveTheme() === "dark";
        themeToggle.innerHTML = dark ? icons.sun : icons.moon;
        themeToggle.setAttribute(
          "aria-label",
          dark ? "切换到浅色主题" : "切换到深色主题"
        );
      };
      updateThemeButton();

      themeToggle.addEventListener("click", () => {
        const next = effectiveTheme() === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        try {
          localStorage.setItem("book-grilling-theme", next);
        } catch {
          // The reader remains fully functional when storage is unavailable.
        }
        updateThemeButton();
      });

      const syncMenuAccessibility = () => {
        sidebar.inert =
          mobileMenu.matches && body.dataset.menuOpen !== "true";
      };

      const closeMenu = ({ returnFocus = false } = {}) => {
        body.dataset.menuOpen = "false";
        menuToggle.setAttribute("aria-expanded", "false");
        menuToggle.setAttribute("aria-label", "打开学习目录");
        syncMenuAccessibility();
        if (returnFocus && mobileMenu.matches) menuToggle.focus();
      };

      const openMenu = () => {
        body.dataset.menuOpen = "true";
        menuToggle.setAttribute("aria-expanded", "true");
        menuToggle.setAttribute("aria-label", "关闭学习目录");
        syncMenuAccessibility();
        sidebar.focus({ preventScroll: true });
      };

      menuToggle.addEventListener("click", () => {
        body.dataset.menuOpen === "true"
          ? closeMenu({ returnFocus: true })
          : openMenu();
      });
      scrim.addEventListener("click", () => closeMenu({ returnFocus: true }));
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && body.dataset.menuOpen === "true") {
          closeMenu({ returnFocus: true });
        }
      });
      mobileMenu.addEventListener("change", () => {
        if (!mobileMenu.matches) body.dataset.menuOpen = "false";
        syncMenuAccessibility();
      });
      syncMenuAccessibility();

      const navigate = (target) => {
        location.hash = target === "overview"
          ? "#overview"
          : `#unit=${encodeURIComponent(target)}`;
      };

      const currentRoute = () => {
        const match = location.hash.match(/^#unit=(.+)$/);
        if (!match) return { type: "overview", id: "" };
        try {
          return { type: "unit", id: decodeURIComponent(match[1]) };
        } catch {
          return { type: "overview", id: "" };
        }
      };

      const unitCanOpen = (id) => {
        const status = state.unit_records[id]?.status;
        return ["completed", "current", "needs_preparation", "invalid"].includes(status);
      };

      const renderTocLevel = (parentId = "") => {
        const items = children[parentId] || [];
        if (!items.length) return "";
        return `<ul class="toc">${items.map((unit) => {
          const nested = renderTocLevel(unit.id);
          if (!unit.learning_unit) {
            return `<li><div class="toc-group">${escapeHtml(unit.title)}</div>${nested}</li>`;
          }
          const record = state.unit_records[unit.id];
          const [label, tone, statusIcon] = statusMeta(record.status);
          const item = unitCanOpen(unit.id)
            ? `<button class="toc-link" type="button" data-unit="${escapeHtml(unit.id)}" data-status="${escapeHtml(record.status)}"><span class="toc-status" aria-hidden="true">${statusIcon}</span><span class="toc-title">${escapeHtml(unit.title)}<span class="sr-only">，${label}</span></span></button>`
            : `<div class="toc-future"><span class="toc-status" aria-hidden="true">${statusIcon}</span><span class="toc-title">${escapeHtml(unit.title)}<span class="sr-only">，${label}</span></span></div>`;
          return `<li>${item}${nested}</li>`;
        }).join("")}</ul>`;
      };

      document.getElementById("toc-root").innerHTML = renderTocLevel();
      document.getElementById("toc-root").addEventListener("click", (event) => {
        const button = event.target.closest("[data-unit]");
        if (!button) return;
        navigate(button.dataset.unit);
        closeMenu();
      });

      const statusBadge = (status) => {
        const [label, tone, statusIcon] = statusMeta(status);
        return `<span class="badge" data-tone="${tone}">${statusIcon}${label}</span>`;
      };

      const nextActionUnit = () => {
        if (!state.current_unit_id) return null;
        return unitById[state.current_unit_id] || null;
      };

      const unitCard = (unit, index) => {
        const record = state.unit_records[unit.id];
        const [label] = statusMeta(record.status);
        const interactive = unitCanOpen(unit.id);
        return `
          <button
            class="unit-card"
            type="button"
            ${interactive ? `data-unit="${escapeHtml(unit.id)}"` : "disabled"}
          >
            <span class="unit-card-top">
              <span class="unit-number">UNIT ${String(index + 1).padStart(2, "0")}</span>
              ${statusBadge(record.status)}
            </span>
            <span>
              <h3>${escapeHtml(unit.title)}</h3>
              <p>${escapeHtml(unit.locator)} · ${label}</p>
            </span>
          </button>
        `;
      };

      const renderSynthesis = () => {
        const synthesis = state.synthesis;
        if (!synthesis) return "";
        return `
          <section class="section" aria-labelledby="synthesis-title">
            <div class="synthesis">
              <div>
                <p class="eyebrow">全书收束</p>
                <h2 id="synthesis-title">${escapeHtml(synthesis.question)}</h2>
              </div>
              <p class="synthesis-answer">${escapeHtml(synthesis.recommended_answer)}</p>
              <div>
                <span class="answer-label">各单元的贡献</span>
                <ul class="contribution-list">
                  ${synthesis.unit_contributions.map((item, index) => `
                    <li>
                      <button class="contribution-button" type="button" data-unit="${escapeHtml(item.unit_id)}">
                        <span class="node-index">${String(index + 1).padStart(2, "0")}</span>
                        <span>${escapeHtml(item.contribution)}</span>
                        <span aria-hidden="true">${icons.arrow}</span>
                      </button>
                    </li>
                  `).join("")}
                </ul>
              </div>
              ${synthesis.boundaries.length ? `
                <div>
                  <span class="answer-label">边界与未决问题</span>
                  <ul>${synthesis.boundaries.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
                </div>
              ` : ""}
            </div>
          </section>
        `;
      };

      const renderOverview = () => {
        const current = nextActionUnit();
        const statusText =
          state.book_status === "completed"
            ? (isPartial ? "已讲完当前部分" : "已经系统讲完")
            : state.book_status === "ready_for_synthesis"
              ? (isPartial ? "等待部分收束" : "等待全书收束")
              : "正在逐单元学习";
        view.innerHTML = `
          <section class="hero-grid">
            <div>
              <p class="eyebrow">Book Grilling</p>
              <h1>${escapeHtml(state.book.title)}</h1>
              <p class="lede">沿着作者的来源结构，一次只处理一个问题。已学内容成为可回顾的知识树，未来内容保持锁定。</p>
              <div class="meta-row">
                <span class="meta-item">${icons.book}<span>${escapeHtml(state.book.author)}</span></span>
                <span class="meta-item">${icons.source}<span>${escapeHtml(state.book.edition)}</span></span>
                <span class="badge" data-tone="${isPartial ? "danger" : "complete"}">
                  ${isPartial ? icons.warning : icons.verified}
                  ${isPartial ? "部分来源" : "完整来源"}
                </span>
              </div>
              ${isPartial ? `
                <div class="interpretive-note">
                  ${icons.warning}
                  <span>${escapeHtml(state.source.coverage_note)}</span>
                </div>
              ` : ""}
            </div>
            <div class="stat-panel" aria-label="学习统计">
              <div class="stat"><span>学习进度</span><strong>${percent}%</strong></div>
              <div class="stat"><span>当前状态</span><strong style="font-size:20px">${statusText}</strong></div>
            </div>
          </section>

          ${current ? `
            <section class="section" aria-labelledby="continue-title">
              <div class="callout">
                <span class="callout-label">${icons.current} 当前学习位置</span>
                <h3 id="continue-title">${escapeHtml(current.title)}</h3>
                <p>${escapeHtml(current.locator)}</p>
                <button class="text-button" type="button" data-unit="${escapeHtml(current.id)}">
                  继续学习 ${icons.arrow}
                </button>
              </div>
            </section>
          ` : state.book_status === "ready_for_synthesis" ? `
            <section class="section">
              <div class="callout">
                <span class="callout-label">${icons.verified} 全部单元完成</span>
                <h3>${isPartial ? "等待建立当前部分收束" : "等待建立全书收束"}</h3>
                <p>${isPartial ? "当前可用来源单元" : "所有来源单元"}已经系统讲完。完成一次经过复核的综合后，课程即可归档。</p>
              </div>
            </section>
          ` : ""}

          ${renderSynthesis()}

          <section class="section" aria-labelledby="unit-index-title">
            <div class="section-heading">
              <div>
                <p class="eyebrow">学习单元</p>
                <h2 id="unit-index-title">从来源结构进入</h2>
              </div>
              <p>完成单元可以随时回顾；当前单元逐题展开；未来单元只保留目录位置。</p>
            </div>
            <div class="unit-grid">
              ${learningUnits.map(unitCard).join("")}
            </div>
          </section>
        `;
        bindUnitButtons();
      };

      const ancestry = (unit) => {
        const result = [];
        let current = unit;
        while (current) {
          result.unshift(current);
          current = current.parent_id ? unitById[current.parent_id] : null;
        }
        return result;
      };

      const renderNode = (node, tree, progress, sequenceById) => {
        const childNodes = tree.nodes
          .filter((candidate) => candidate.parent_id === node.id)
          .sort((a, b) => a.position - b.position);
        const nodeProgress = progress[node.id] || { status: node.status || "locked" };
        const status = nodeProgress.status || node.status || "locked";
        const number = String(sequenceById[node.id]).padStart(2, "0");
        let card = "";
        if (status === "locked") {
          card = `
            <article class="node-card" data-status="locked" aria-label="锁定问题：${escapeHtml(node.question)}">
              <div class="locked-body">
                <span class="node-index">${number}</span>
                <span class="node-question">${escapeHtml(node.question)}</span>
                <span aria-hidden="true">${icons.lock}</span>
              </div>
            </article>
          `;
        } else {
          const tone = status === "resolved" ? "complete" : "current";
          const label = status === "resolved" ? "已讲清" : "当前问题";
          const openQuestions = nodeProgress.open_questions || [];
          card = `
            <details class="node-card" data-status="${status}" ${status === "current" ? "open" : ""}>
              <summary class="node-summary">
                <span class="node-index" aria-hidden="true">${status === "resolved" ? icons.check : number}</span>
                <span class="node-question">${escapeHtml(node.question)}</span>
                <span class="chevron" aria-hidden="true">${icons.chevron}</span>
                <span class="sr-only">${label}，点击展开答案</span>
              </summary>
              <div class="node-body">
                <div>
                  <span class="answer-label">推荐答案 · ${escapeHtml(provenanceLabels[node.provenance] || node.provenance)}</span>
                  <p class="answer">${escapeHtml(node.recommended_answer)}</p>
                </div>
                ${node.interpretive_note ? `
                  <div class="interpretive-note">${icons.verified}<span>${escapeHtml(node.interpretive_note)}</span></div>
                ` : ""}
                ${openQuestions.map((item) => `
                  <div class="open-question">${icons.warning}<span>${escapeHtml(item.text)}</span></div>
                `).join("")}
                ${nodeProgress.learner_note ? `
                  <div class="learner-note">${icons.check}<span>${escapeHtml(nodeProgress.learner_note)}</span></div>
                ` : ""}
                <div class="source-box">
                  <span class="source-label">原文依据</span>
                  <blockquote>${escapeHtml(node.source.excerpt)}</blockquote>
                  <div class="source-locator">${escapeHtml(node.source.locator)}</div>
                </div>
              </div>
            </details>
          `;
        }
        return `
          <li class="tree-node">
            ${card}
            ${childNodes.length ? `<ol>${childNodes.map((child) => renderNode(child, tree, progress, sequenceById)).join("")}</ol>` : ""}
          </li>
        `;
      };

      const renderUnit = (unitId) => {
        const unit = unitById[unitId];
        const record = state.unit_records[unitId];
        if (!unit || !record || !unitCanOpen(unitId)) {
          renderOverview();
          return;
        }
        const lineage = ancestry(unit);
        const [statusLabel, statusTone] = statusMeta(record.status);
        const tree = record.tree;
        const progress = record.progress || {};
        const resolvedNodes = Object.values(progress).filter(
          (item) => item.status === "resolved"
        ).length;
        const nodeTotal = tree?.nodes.length || 0;
        const unitPercent = nodeTotal
          ? Math.round((resolvedNodes / nodeTotal) * 100)
          : 0;

        let treeContent = "";
        if (!tree) {
          const invalid = record.status === "invalid";
          treeContent = `
            <div class="empty-state">
              <div class="empty-state-inner">
                <span class="empty-icon" aria-hidden="true">${invalid ? icons.warning : icons.map}</span>
                <h2>${invalid ? "这个单元需要重新核查" : "知识树尚未初始化"}</h2>
                <p>${invalid ? "原有内容已经失效。重新读取来源、生成并通过独立审核后才会解锁。" : "技能将完整读取这个来源单元，建立问题树并完成独立审核。审核通过前不会展示答案。"}</p>
              </div>
            </div>
          `;
        } else {
          const nodeById = Object.fromEntries(tree.nodes.map((node) => [node.id, node]));
          const sequenceById = {};
          let cursor = 0;
          const walk = (id) => {
            sequenceById[id] = ++cursor;
            tree.nodes
              .filter((node) => node.parent_id === id)
              .sort((a, b) => a.position - b.position)
              .forEach((node) => walk(node.id));
          };
          walk(tree.root_id);
          treeContent = `
            <div class="tree-intro">
              <div>
                <p class="eyebrow">单元知识树</p>
                <h2>${escapeHtml(tree.title)}</h2>
              </div>
              <span class="badge" data-tone="complete">${icons.verified} 已独立复核</span>
            </div>
            <ol class="knowledge-tree">
              ${renderNode(nodeById[tree.root_id], tree, progress, sequenceById)}
            </ol>
          `;
        }

        view.innerHTML = `
          <nav class="breadcrumb" aria-label="当前位置">
            <button type="button" data-nav="overview">全书</button>
            ${lineage.map((item, index) => `
              <span aria-hidden="true">/</span>
              <span ${index === lineage.length - 1 ? 'aria-current="page"' : ""}>${escapeHtml(item.title)}</span>
            `).join("")}
          </nav>
          <header class="unit-header">
            <div class="unit-title-row">
              <div>
                <p class="eyebrow">${escapeHtml(unit.kind)} · 学习单元 ${unit.sequence}</p>
                <h1>${escapeHtml(unit.title)}</h1>
              </div>
              <span class="badge" data-tone="${statusTone}">${statusLabel}</span>
            </div>
            <p class="unit-locator">${icons.source}<span>${escapeHtml(unit.locator)}</span></p>
            ${tree ? `
              <div class="unit-progress">
                <div class="unit-progress-copy">
                  <span>${resolvedNodes} / ${nodeTotal} 个问题已讲清</span>
                  <strong>${unitPercent}%</strong>
                </div>
                <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${unitPercent}">
                  <div class="progress-fill" style="--progress:${unitPercent}%"></div>
                </div>
              </div>
            ` : ""}
          </header>
          <section class="section" aria-label="当前单元知识树">
            ${treeContent}
          </section>
        `;
        bindUnitButtons();
      };

      const bindUnitButtons = () => {
        view.querySelectorAll("[data-unit]").forEach((button) => {
          button.addEventListener("click", () => navigate(button.dataset.unit));
        });
        view.querySelectorAll("[data-nav='overview']").forEach((button) => {
          button.addEventListener("click", () => navigate("overview"));
        });
      };

      const updateCurrentToc = () => {
        const route = currentRoute();
        document.querySelectorAll(".toc-link").forEach((item) => {
          if (route.type === "unit" && item.dataset.unit === route.id) {
            item.setAttribute("aria-current", "page");
          } else {
            item.removeAttribute("aria-current");
          }
        });
      };

      const render = ({ focusMain = true } = {}) => {
        const route = currentRoute();
        if (route.type === "unit" && unitCanOpen(route.id)) {
          renderUnit(route.id);
          liveRegion.textContent = `已打开 ${unitById[route.id]?.title || "学习单元"}`;
        } else {
          renderOverview();
          liveRegion.textContent = "已打开全书概览";
        }
        updateCurrentToc();
        closeMenu();
        requestAnimationFrame(() => {
          if (focusMain) {
            document.getElementById("main-content").focus({
              preventScroll: true
            });
          }
          scrollTo({ top: 0, behavior: "auto" });
        });
      };

      document.querySelectorAll("[data-nav='overview']").forEach((item) => {
        item.addEventListener("click", (event) => {
          event.preventDefault();
          navigate("overview");
        });
      });
      addEventListener("hashchange", () => render({ focusMain: true }));
      if (!location.hash) {
        history.replaceState(null, "", "#overview");
      }
      render({ focusMain: false });
    })();
  </script>
</body>
</html>
